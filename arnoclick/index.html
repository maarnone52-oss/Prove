<style>
:root{--bg:#0d0e10;--chassis1:#2b2e33;--chassis2:#1e2024;--edge:#3b3f46;--print:#b9bec6;--dim:#7d838c;
 --red:#ff4530;--green:#46ff7a;--amber:#ffb21e;--text:#eceef0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:max(18px,calc(env(safe-area-inset-top,0px) / var(--uis,1))) max(16px,calc(env(safe-area-inset-right,0px) / var(--uis,1))) 40px max(16px,calc(env(safe-area-inset-left,0px) / var(--uis,1)))}
.langs{display:flex;gap:6px}
#sizePop{position:fixed;z-index:60;top:calc(calc(env(safe-area-inset-top,0px) / var(--uis,1)) + 70px);right:max(12px,calc(env(safe-area-inset-right,0px) / var(--uis,1)));background:#1b1e23;border:1px solid #3a3f47;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px;max-width:330px}
#sizePop[hidden]{display:none}
#sizePop .sizeRow{display:flex;align-items:center;gap:8px}
#sizePop .sizeRow[hidden]{display:none}
#sizePhone .btn{flex:1;min-width:90px}
html.daw #sizePop{top:auto;bottom:34px}
#sizePop .sizeRow .btn{min-height:44px;min-width:52px;font-size:20px;padding:0 12px}
#sizePop #sizeReset{font-size:14px}
#sizePop b{min-width:64px;text-align:center;font-size:20px;color:#ffc04d;font-variant-numeric:tabular-nums}
#sizePop .note{font-size:13px;color:#9aa0a8}
#helpBtn{min-height:40px;padding:0 12px;font-size:15px}
body.noscroll{overflow:hidden}
#help{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.72);display:flex;justify-content:center;align-items:flex-start;padding:max(16px,calc(env(safe-area-inset-top,0px) / var(--uis,1))) 12px 16px;overflow:auto}
#help[hidden]{display:none}
#helpPanel{width:100%;max-width:780px;margin:0;max-height:calc(100vh - 32px);overflow:auto}
.helphead{display:flex;align-items:center;gap:12px;position:sticky;top:-18px;background:linear-gradient(180deg,var(--chassis1),var(--chassis1) 80%,transparent);padding:4px 0 10px;z-index:1}
.helphead .logo{height:40px;width:88px}
.helphead h2{flex:1;margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--print)}
.helphead .btn{min-height:44px;min-width:44px}
.helptoc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.helptoc .chip{min-height:36px;padding:0 10px;font-size:13px;border-radius:18px}
#helpBody details{border:1px solid #33373e;border-radius:10px;margin:8px 0;background:rgba(0,0,0,.2)}
#helpBody summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:16px;list-style:none}
#helpBody summary::-webkit-details-marker{display:none}
#helpBody summary::after{content:"＋";float:right;color:var(--amber)}
#helpBody details[open] summary::after{content:"－"}
.hbody{padding:0 16px 12px;color:#d6d9dd;font-size:15px;line-height:1.55}
.hbody p{margin:8px 0}.hbody ul{margin:8px 0;padding-left:20px}.hbody b{color:#fff}
.modes{display:flex;gap:8px;margin-top:14px}
.modes[hidden]{display:none}
.modes .btn{flex:1;max-width:260px;min-height:50px;font-size:17px}
.modes .btn.on{background:linear-gradient(180deg,#ffc44d,#e89a00);color:#1b1305;border-color:#ffcf6b;border-bottom-color:#7a5000}
.livetop{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.livetop .lvside{flex:1 1 100%}.lvgowrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}.lvgowrap .lbl{text-align:center;max-width:84px;font-size:10px;line-height:1.25}.livetop{gap:14px!important}
#lvGo.lvround{width:68px;height:68px;min-width:0;border-radius:50%;padding:0;font-size:26px;display:flex;align-items:center;justify-content:center}
.lvdevrow{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.lvside{flex:1;min-width:220px}
.stab{height:12px;border-radius:6px;background:#0a0403;box-shadow:inset 0 2px 4px #000;overflow:hidden;margin:6px 0 4px}
.stab i{display:block;height:100%;width:0;background:#ff4530;transition:width .3s}
.stab i.mid{background:#ffb21e}.stab i.hi{background:#46ff7a;box-shadow:0 0 10px rgba(70,255,122,.6)}
.meter{display:flex;gap:3px;margin:6px 0}
.meter i{flex:1;height:16px;border-radius:2px;background:#0d2a14}
.meter i.a{background:#3a2a06}.meter i.r{background:#3a0e08}
.meter i.on{background:#46ff7a;box-shadow:0 0 6px rgba(70,255,122,.6)}
.meter i.a.on{background:#ffb21e;box-shadow:0 0 6px rgba(255,178,30,.6)}
.meter i.r.on{background:#ff4530;box-shadow:0 0 6px rgba(255,69,48,.7)}
#lvDev{min-height:58px;font-size:17px;width:100%;max-width:100%;background:#111317;color:var(--text);border:1px solid #3a404b;border-radius:8px;padding:0 10px}
#lvMsg.err{color:#ff8a80}
#lvGo.on{background:linear-gradient(180deg,#ff6a52,#d42a14);border-color:#ff8a77;border-bottom-color:#6e0d03;color:#fff}
.langs .btn{min-height:40px;min-width:52px;padding:0 10px;font-size:15px}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--print);font-weight:600}
.rack{position:relative;background:linear-gradient(180deg,var(--chassis1),var(--chassis2));border:1px solid var(--edge);border-radius:14px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 30px rgba(0,0,0,.55);padding:18px 22px;margin-bottom:16px}
.rack::before,.rack::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;
 background:radial-gradient(circle at 35% 35%,#8a8f97,#3b3e43 70%);box-shadow:inset 0 0 0 1px #1a1b1e}
.rack::before{left:10px}.rack::after{right:10px}
/* ===== App per Mac: disposizione a pannelli come un DAW (solo finestra larga) ===== */
.dawtop,.dawbody,#dawMain,#dawSide,.dawstatus,.dawtr{display:contents}
.dawlogo,.dawver{display:none}
@media (min-width:980px){
 html.daw,html.daw body{height:100%;overflow:hidden}
 html.daw main{max-width:none;margin:0;padding:0;height:100vh;display:flex;flex-direction:column}
 html.daw footer,html.daw .brand,html.daw .grid:empty{display:none}
 html.daw .dawtop{display:flex;align-items:center;gap:16px;padding:8px 14px;flex:none;background:linear-gradient(180deg,var(--chassis1),var(--chassis2));border-bottom:1px solid #000;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:2;overflow:hidden}
 html.daw .dawlogo{display:block;height:46px;width:101px;flex:none}
 html.daw .dawtr{display:flex;gap:8px;align-items:center;flex:none}
 html.daw .dawtr #play{min-width:132px}
 html.daw .dawtop .displays{display:flex;gap:10px;align-items:center;flex:none}
 html.daw .dawtop .dbox{padding:4px 8px}
 html.daw .dawtop .range,html.daw .dawtop .ledbox .note,html.daw .dawtop .delta{display:none}
 html.daw .dawtop .ledbox{display:flex;align-items:center;gap:8px}
 html.daw .dawtop .ledbox>.lbl{display:none}
 html.daw .dawtop .leds{padding:0;gap:8px;flex-wrap:nowrap}
 html.daw .dawtop .lamp.big{width:30px;height:30px}
 html.daw .dawtop .bpmrow{gap:10px;flex-wrap:nowrap}
 html.daw #work .transport{margin:0 0 10px;gap:6px}
 html.daw #video{max-height:min(32vh,300px)}
 html.daw:not(.loaded) .dawtop .displays,html.daw:not(.loaded) .dawtr{opacity:.3;pointer-events:none}
 html.daw .dawbody{display:flex;flex:1;min-height:0}
 html.daw #dawMain{display:block;flex:1;min-width:0;overflow-y:auto;padding:12px 14px 20px}
 html.daw #dawSide{display:block;width:350px;flex:none;overflow-y:auto;padding:12px 12px 20px;border-left:1px solid #000;background:#16171a}
 html.daw:not(.loaded) #dawSide{display:none}
 html.daw #dawSide .rack{padding:14px 14px;margin-bottom:12px}
 html.daw #dawSide .rack::before,html.daw #dawSide .rack::after{display:none}
 html.daw #dawSide .mixer{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
 html.daw #dawSide .note{font-size:12px}
 html.daw .dawstatus{display:flex;align-items:center;gap:16px;height:30px;padding:0 12px;flex:none;background:#1b1c20;border-top:1px solid #000;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
 html.daw .dawstatus #status{margin:0;min-height:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
 html.daw .dawstatus .fname{margin:0;font-size:12.5px;color:var(--print);max-width:40%;overflow:hidden;text-overflow:ellipsis;word-break:normal}
 html.daw .dawstatus .fname small{display:none}
 html.daw .dawver{display:inline;flex:none;font-size:15px;font-weight:800;color:#ffb21e;letter-spacing:.04em}
 html.daw .dawstatus #uiBtn{min-height:22px;padding:0 10px;font-size:12px}
 html.daw .dawstatus .dawlangs{display:flex;gap:4px;flex-wrap:nowrap;flex:none;align-items:center}
 html.daw .dawstatus .dawlangs .btn{min-height:22px;min-width:0;padding:0 8px;font-size:12px}
 html.daw .dawstatus .dawlangs #themeBtn svg{width:14px;height:14px}
 html.daw .dawstatus .dawlangs #helpBtn,html.daw .dawstatus .dawlangs #themeBtn,html.daw .dawstatus .dawlangs #uiBtn{min-height:22px;height:22px;padding:0 8px;font-size:12px;min-width:0}
 html.daw .tl{display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid #000;border-radius:8px;overflow:hidden;background:#141518;box-shadow:0 2px 10px rgba(0,0,0,.5)}
 html.daw .tl .dawonly{display:block}
 html.daw .tl .tlh{display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:4px 7px;padding:4px 8px;background:#24272b;border-bottom:1px solid #000;border-right:1px solid #000;font-size:12.5px;min-width:0}
 html.daw .tl .tlh b{font-size:12.5px}
 html.daw .tl .tlh small{flex-basis:100%;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px}
 html.daw .tl .tlh small .lg{margin-left:0;width:12px}
 html.daw .tl .tlc{width:4px;height:15px;border-radius:2px;display:block}
 html.daw .tl .tlh{position:relative;box-sizing:border-box;overflow:hidden}
 html.daw .tl .tlgrip{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:row-resize;z-index:2}
 html.daw .tl .tlgrip:hover{background:rgba(56,198,255,.45)}
 html.daw .tl .tlh.mini{padding-top:0;padding-bottom:0;flex-wrap:nowrap}
 html.daw .tl .tlh.mini small,html.daw .tl .tlh.mini .vu,html.daw .tl .tlh.mini .tlbtns{display:none}
 html.daw .tl .tlh.mini .tlm{min-height:18px;font-size:10.5px;padding:0 4px}
 html.daw .tl .vu{flex-basis:100%;width:100%;height:22px;background:#08090a;border-radius:3px;box-shadow:inset 0 1px 3px #000}

to\x20del\x20<b>primo\x20tempo</b>,\x20fader\x20<b>Andamento</b>\x20(da\x20«segue\x20il\x20brano»\x20a\x20«metronomo\x20fisso»)\x20e\x20<b>Allineamento</b>,\x20<b>Risoluzione\x20dell\x27analisi</b>\x20(terzine\x20comprese),\x20e\x20nelle\x20aree\x20scelte\x20con\x20i\x20marker\x20arancioni\x20<b>Ammorbidimento</b>,\x20<b>Oscillazioni</b>\x20e\x20<b>Tempo</b>\x20del\x20click,\x20con\x20prova,\x20conferma\x20e\x20<b>archivio\x20delle\x20modifiche</b>.\x20Se\x20serve\x20il\x20contrario,\x20cioè\x20portare\x20la\x20musica\x20su\x20un\x20tempo\x20costante,\x20c\x27è\x20<b>⏱\x20Brano\x20a\x20tempo\x20fisso</b>\x20(con\x20i\x20brani\x20molto\x20liberi\x20l\x27allineamento\x20può\x20lasciare\x20piccoli\x20difetti\x20udibili:\x20ascolta\x20sempre\x20l\x27anteprima).</p>\x0a<p><b>La\x20verifica\x20ad\x20orecchio\x20è\x20sempre\x20indispensabile.</b>\x20Il\x20grafico\x20e\x20i\x20numeri\x20indicano\x20<i>dove</i>\x20guardare,\x20ma\x20è\x20l\x27orecchio\x20a\x20decidere\x20se\x20il\x20click\x20è\x20giusto.\x20Prima\x20di\x20esportare\x20ascolta\x20tutto\x20il\x20brano\x20con\x20il\x20click,\x20soprattutto\x20inizio,\x20finale\x20e\x20passaggi\x20delicati:\x20usa\x20il\x20<b>loop</b>\x20sui\x20punti\x20dubbi\x20e\x20il\x20piccolo\x20<b>▶</b>\x20che\x20ascolta\x20con\x20il\x20click\x20in\x20primo\x20piano\x20(musica\x20più\x20bassa,\x20click\x20più\x20alto).\x20Ascolta\x20in\x20<b>cuffie\x20con\x20il\x20filo</b>\x20o\x20dagli\x20altoparlanti:\x20le\x20cuffie\x20Bluetooth\x20aggiungono\x20un\x20ritardo\x20che\x20inganna\x20(regola\x20semmai\x20<b>Sincro\x20LED</b>).\x20Dopo\x20l\x27esportazione,\x20controlla\x20anche\x20nel\x20sequencer\x20che\x20il\x20click\x20MIDI\x20cada\x20dove\x20ti\x20aspetti.</p>\x0a<p><b>A\x20volte\x20basta\x20la\x20sensazione\x20giusta.</b>\x20Il\x20click\x20non\x20deve\x20coincidere\x20al\x20millisecondo\x20con\x20ogni\x20colpo:\x20i\x20musicisti\x20suonano\x20naturalmente\x20un\x20po\x27\x20avanti\x20o\x20un\x20po\x27\x20indietro,\x20e\x20differenze\x20di\x20pochi\x20millesimi\x20di\x20secondo\x20di\x20solito\x20non\x20si\x20avvertono.\x20Se\x20suonando\x20sopra\x20al\x20brano\x20il\x20click\x20«tiene»,\x20non\x20tira\x20e\x20non\x20trattiene,\x20il\x20lavoro\x20è\x20fatto\x20anche\x20se\x20il\x20grafico\x20non\x20è\x20perfettamente\x20liscio.\x20Al\x20contrario,\x20un\x20grafico\x20pulito\x20non\x20garantisce\x20che\x20il\x20click\x20sia\x20giusto:\x20un\x20click\x20messo\x20in\x20levare,\x20al\x20doppio\x20o\x20con\x20la\x20battuta\x20spostata\x20può\x20sembrare\x20perfetto\x20a\x20vederlo\x20e\x20risultare\x20sbagliato\x20all\x27ascolto.\x20Inseguire\x20la\x20perfezione\x20matematica\x20su\x20un\x20brano\x20suonato\x20dal\x20vivo\x20spesso\x20peggiora\x20il\x20risultato:\x20meglio\x20un\x20click\x20che\x20segue\x20con\x20naturalezza\x20il\x20respiro\x20del\x20brano.</p>\x0a<p><b>Un\x20ordine\x20di\x20lavoro\x20consigliato</b>:\x20①\x20controlla\x20che\x20il\x20BPM\x20medio\x20sia\x20plausibile\x20(altrimenti\x20÷2\x20/\x20×2);\x20②\x20sistema\x20battuta\x20e\x20primo\x20tempo\x20guardando\x20il\x20LED\x20rosso;\x20③\x20ascolta\x20tutto\x20il\x20brano\x20e\x20annota\x20i\x20punti\x20dubbi;\x20④\x20correggi\x20l\x27eventuale\x20anticipo\x20o\x20ritardo\x20generale\x20con\x20Allineamento;\x20⑤\x20intervieni\x20solo\x20sulle\x20aree\x20che\x20lo\x20richiedono;\x20⑥\x20riascolta,\x20esporta\x20e\x20verifica\x20nel\x20sequencer.</p>'],['🚀\x20Per\x20iniziare',lC(0x243)],[lC(0xa44),'<p><b>BPM\x20medio</b>:\x20il\x20tempo\x20del\x20brano.\x20<b>BPM\x20istantaneo</b>:\x20il\x20tempo\x20nel\x20punto\x20che\x20stai\x20ascoltando,\x20media\x20degli\x20ultimi\x204\x20battiti;\x20accanto,\x20▲\x20ambra\x20se\x20accelera,\x20▼\x20azzurro\x20se\x20rallenta.</p>\x0a<p>I\x20<b>LED\x20tondi</b>\x20lampeggiano\x20a\x20tempo:\x20rosso\x20sul\x20primo\x20tempo\x20della\x20battuta,\x20verdi\x20sugli\x20altri.\x20<b>Battuta\x20.\x20tempo</b>\x20e\x20<b>Posizione</b>\x20indicano\x20dove\x20sei.</p>\x0a<p><b>Sincro\x20LED</b>\x20(−\x20/\x20+)\x20anticipa\x20o\x20ritarda\x20i\x20LED\x20di\x205\x20ms\x20alla\x20volta\x20finché\x20lampo\x20e\x20click\x20coincidono;\x20con\x20le\x20cuffie\x20Bluetooth\x20serve\x20spesso\x20un\x20valore\x20negativo.\x20La\x20regolazione\x20resta\x20memorizzata\x20sul\x20dispositivo.</p>'],[lC(0x3c7),'<p>Sulla\x20forma\x20d\x27onda\x20le\x20linee\x20<b>rosse</b>\x20sono\x20i\x20primi\x20tempi\x20(con\x20il\x20numero\x20di\x20battuta),\x20le\x20<b>verdi</b>\x20gli\x20altri\x20tempi;\x20la\x20linea\x20<b>bianca</b>\x20è\x20il\x20cursore.</p>\x0a<p>Il\x20<b>grafico\x20del\x20tempo</b>\x20mostra\x20in\x20rosso\x20il\x20tempo\x20del\x20brano\x20battito\x20per\x20battito,\x20in\x20verde\x20quello\x20del\x20click\x20e\x20tratteggiato\x20il\x20BPM\x20medio.</p>\x0a<p>Un\x20tocco\x20sposta\x20il\x20cursore,\x20trascinando\x20scorri\x20la\x20vista.\x20Zoom:\x20<b>−\x20+\x20Tutto</b>,\x20<b>due\x20dita</b>\x20sul\x20telefono,\x20<b>rotella\x20del\x20mouse</b>\x20o\x20pizzico\x20sul\x20trackpad\x20sul\x20Mac\x20(Maiusc\x20+\x20rotella\x20sposta\x20la\x20vista).\x20Il\x20punto\x20fermo\x20dello\x20zoom\x20è\x20il\x20cursore.</p>\x0a<p><b>Risoluzione\x20dell\x27analisi</b>:\x20per\x20trovare\x20i\x20battiti\x20ARNOCLICK\x20guarda\x20anche\x20gli\x20attacchi\x20in\x20mezzo,\x20alle\x20suddivisioni\x20scelte\x20(<b>1/8</b>,\x20<b>1/16</b>\x20(quella\x20normale),\x20<b>1/32</b>,\x20<b>1/64</b>\x20e\x20le\x20terzine\x20<b>1/8T</b>,\x20<b>1/16T</b>,\x20<b>1/32T</b>,\x20<b>1/64T</b>\x20per\x20i\x20brani\x20in\x20terzine):\x20un\x20battito\x20è\x20più\x20sicuro\x20se\x20anche\x20le\x20suddivisioni\x20cadono\x20al\x20posto\x20giusto.\x20Con\x20<b>1/4</b>\x20guarda\x20solo\x20i\x20battiti,\x20come\x20nelle\x20versioni\x20precedenti.</p>\x0a<p><b>Prova\x20e\x20modifiche\x20applicate</b>:\x20i\x20cursori\x20«Click»\x20(ammorbidimento,\x20oscillazioni\x20e\x20tempo)\x20fanno\x20una\x20<b>prova</b>:\x20la\x20senti\x20subito\x20mentre\x20ascolti\x20e\x20la\x20vedi\x20sul\x20grafico\x20(riquadro\x20arancione\x20tratteggiato),\x20ma\x20non\x20è\x20salvata.\x20Per\x20tenerla\x20premi\x20<b>✔\x20Applica\x20la\x20modifica</b>\x20e\x20tocca\x20di\x20nuovo\x20per\x20confermare;\x20con\x20<b>⟲\x20Azzera\x20i\x207\x20cursori</b>\x20torna\x20tutto\x20com\x27era.\x20Le\x20modifiche\x20applicate\x20finiscono\x20nell\x27archivio\x20<b>Modifiche\x20applicate</b>,\x20numerate\x20(#1,\x20#2…)\x20e\x20segnate\x20in\x20verde\x20sul\x20grafico.\x20Ogni\x20modifica\x20tiene\x20anche\x20le\x20posizioni\x20dei\x204\x20cursori\x20dell\x27area:\x20dopo\x20averla\x20applicata\x20restano\x20dove\x20sono,\x20e\x20toccandola\x20nell\x27archivio\x20la\x20vedi\x20sul\x20grafico\x20e\x20cursori\x20e\x20marker\x20arancioni\x20tornano\x20lì,\x20pronti\x20per\x20ritoccarla\x20(<b>✔\x20Sovrascrivi\x20la\x20modifica</b>,\x20con\x20conferma;\x20puoi\x20anche\x20spostare\x20i\x20marker\x20arancioni).\x20Ogni\x20locazione\x20ha\x20la\x20sua\x20cronologia:\x20con\x20<b>‹\x20›</b>\x20passi\x20da\x20una\x20versione\x20all\x27altra\x20e\x20con\x20<b>⌫</b>\x20ne\x20togli\x20una;\x20ogni\x20area\x20ha\x20<b>un\x20solo</b>\x20posto\x20nell\x27archivio\x20e\x20una\x20sola\x20serie\x20di\x20modifiche;\x20le\x20aree\x20possono\x20sovrapporsi\x20o\x20contenersi,\x20ma\x20i\x20loro\x20limiti\x20non\x20possono\x20coincidere.\x20Sul\x20grafico\x20ogni\x20area\x20ha\x20una\x20linguetta\x20con\x20il\x20suo\x20numero.\x20Toccando\x20una\x20modifica\x20nell\x27archivio\x20(o\x20la\x20sua\x20linguetta\x20sul\x20grafico)\x20la\x20selezioni:\x20la\x20sua\x20area\x20si\x20evidenzia,\x20<b>una\x20alla\x20volta</b>,\x20e\x20tornano\x20cursori\x20e\x20marker;\x20tocca\x20di\x20nuovo\x20per\x20deselezionarla.\x20La\x20casella\x20a\x20sinistra\x20passa\x20dal\x20modificato\x20(✓)\x20all\x27originale\x20(vuota)\x20e\x20viceversa;\x20<b>🗑</b>\x20(con\x20conferma)\x20la\x20elimina\x20per\x20sempre.\x20L\x27archivio\x20si\x20salva\x20con\x20il\x20brano.</p>\x0a<p>Nella\x20sezione\x20<b>Esporta</b>,\x20il\x20riquadro\x20<b>Click\x20corretto</b>\x20salva\x20il\x20click\x20audio\x20(.wav)\x20e\x20MIDI\x20(.mid)\x20come\x20lo\x20senti\x20adesso,\x20con\x20tutte\x20le\x20modifiche\x20attive,\x20l\x27Andamento\x20e\x20l\x27Allineamento.</p>\x0a<p><b>Ammorbidimento</b>:\x20nella\x20sezione\x20Marker\x20metti\x20i\x20due\x20marker\x20arancioni\x20<b>⟦\x20Inizio\x20area</b>\x20e\x20<b>Fine\x20area\x20⟧</b>\x20ai\x20lati\x20del\x20tratto\x20in\x20cui\x20il\x20grafico\x20del\x20tempo\x20ha\x20picchi\x20esagerati\x20(si\x20mettono\x20sul\x20cursore\x20e\x20si\x20trascinano\x20come\x20gli\x20altri),\x20poi\x20muovi\x20il\x20cursore\x20Ammorbidimento.\x20A\x200%\x20il\x20click\x20resta\x20com\x27è,\x20a\x20100%\x20il\x20tempo\x20passa\x20in\x20linea\x20retta\x20da\x20quello\x20prima\x20a\x20quello\x20dopo\x20il\x20tratto;\x20in\x20mezzo\x20il\x20passaggio\x20è\x20continuo.\x20Cambia\x20solo\x20il\x20click\x20(curva\x20verde)\x20fra\x20i\x20marker:\x20la\x20curva\x20rossa\x20del\x20brano\x20resta\x20com\x27è.\x20Il\x20tratto\x20ammorbidito\x20resta\x20segnato\x20in\x20verde;\x20riportando\x20il\x20cursore\x20a\x200%\x20si\x20toglie.\x20Due\x20altri\x20cursori\x20agiscono\x20sempre\x20solo\x20sul\x20click\x20dell\x27area:\x20<b>Click\x20·\x20oscillazioni</b>\x20(al\x20100%\x20invariate;\x20abbassando,\x20i\x20su\x20e\x20giù\x20della\x20curva\x20verde\x20si\x20schiacciano\x20verso\x20il\x20tempo\x20medio\x20dell\x27area,\x20fino\x20a\x20renderla\x20piatta;\x20gli\x20estremi\x20dell\x27area\x20restano\x20fermi)\x20e\x20<b>Click\x20·\x20tempo</b>\x20(alza\x20o\x20abbassa\x20il\x20tempo\x20del\x20click\x20nell\x27area\x20fino\x20a\x20±20%;\x20attenzione:\x20dopo\x20l\x27area\x20il\x20click\x20non\x20è\x20più\x20allineato\x20alla\x20musica).\x20Un\x20doppio\x20tocco\x20riporta\x20un\x20cursore\x20al\x20valore\x20normale.\x20Si\x20salva\x20con\x20il\x20brano\x20e\x20vale\x20anche\x20per\x20gli\x20export.\x20Il\x20piccolo\x20▶\x20della\x20sezione\x20fa\x20partire\x20e\x20fermare\x20l\x27ascolto\x20con\x20il\x20click\x20in\x20primo\x20piano:\x20musica\x20−5\x20dB\x20e\x20click\x20+3\x20dB,\x20solo\x20finché\x20ascolti\x20(i\x20fader\x20non\x20cambiano).</p>'],[lC(0x7df),lC(0x62e)],[lC(0x335),lC(0x976)],['🔔\x20Suono\x20del\x20click',lC(0x502)],[lC(0x660),lC(0x414)],[lC(0x849),lC(0x734)],['🎬\x20Video',lC(0x6d3)],['💾\x20Esportazioni',lC(0x470)],['⏱\x20Brano\x20a\x20tempo\x20fisso/tempo\x20post-prodotto',lC(0x5d2)],[lC(0xa2a),'<p><b>Modalità\x20leggera</b>\x20(app\x20per\x20Mac,\x20menu\x20<b>Vista</b>):\x20sui\x20Mac\x20vecchi\x20alleggerisce\x20l\x27app\x20(meno\x20immagini\x20al\x20secondo,\x20grafici\x20a\x20risoluzione\x20normale,\x20niente\x20VU\x20meter\x20né\x20traccia\x20video\x20nella\x20timeline)\x20così\x20suono,\x20LED\x20e\x20cursore\x20restano\x20a\x20tempo.\x20Si\x20attiva\x20da\x20sola\x20su\x20High\x20Sierra\x20e\x20Mojave;\x20quando\x20è\x20attiva\x20compare\x20⚡\x20in\x20basso.\x20Con\x20essa\x20si\x20attiva\x20anche\x20il\x20<b>video\x20leggero</b>\x20(<b>Vista\x20→\x20Video\x20leggero</b>):\x20durante\x20l\x27ascolto\x20il\x20video\x20mostra\x20un\x20fotogramma\x20al\x20secondo\x20circa\x20invece\x20di\x20scorrere,\x20così\x20resta\x20sempre\x20a\x20tempo;\x20a\x20brano\x20fermo\x20torna\x20normale.</p>\x0a<p><b>Tema</b>:\x20il\x20pulsante\x20<b>◐</b>\x20accanto\x20a\x20Guida\x20passa\x20dal\x20fondo\x20nero\x20al\x20fondo\x20grigio\x20e\x20viceversa\x20(nell\x27app\x20per\x20Mac\x20anche\x20da\x20<b>Vista\x20→\x20Tema</b>).\x20Display\x20e\x20grafici\x20restano\x20scuri\x20per\x20leggerli\x20bene.\x20Con\x20il\x20tema\x20grigio\x20compare\x20un\x20<b>cursore</b>\x20(accanto\x20al\x20pulsante,\x20o\x20in\x20basso\x20a\x20destra\x20nell\x27interfaccia\x20a\x20pannelli)\x20che\x20regola\x20il\x20grigio\x20da\x20scuro\x20a\x20chiaro;\x20nell\x27app\x20per\x20Mac\x20anche\x20<b>Vista\x20→\x20Tema\x20→\x20Grigio\x20più\x20chiaro\x20/\x20più\x20scuro</b>.</p>\x0a<p>Sul\x20computer:\x20<b>spazio</b>\x20Play/Pausa,\x20<b>L</b>\x20loop,\x20<b>I</b>\x20Inizio,\x20<b>F</b>\x20Fine,\x20<b>T</b>\x20prova\x20il\x20suono,\x20<b>←\x20→</b>\x20battuta\x20precedente/successiva,\x20<b>⌥←\x20⌥→</b>\x20marker\x20precedente/successivo.</p>\x0a<p>Nell\x27<b>app\x20per\x20Mac</b>\x20tutti\x20i\x20comandi\x20sono\x20anche\x20nei\x20menu\x20in\x20alto\x20(File,\x20Modifica,\x20Trasporto,\x20Marker,\x20Traccia,\x20Esporta,\x20Vista),\x20con\x20le\x20scorciatoie\x20scritte\x20accanto:\x20ad\x20esempio\x20⌘O\x20apri,\x20⌘S\x20salva\x20il\x20progetto,\x20⌘E\x20click\x20MIDI,\x20⌘B\x20imposta\x20il\x20BPM,\x20⌘]\x20e\x20⌘[\x20raddoppia\x20e\x20dimezza,\x20⌘+\x20⌘−\x20⌘0\x20zoom,\x20⌘R\x20ruota\x20il\x20video.\x20I\x20menu\x20seguono\x20la\x20lingua\x20scelta.</p>\x0a<p>L\x27app\x20per\x20Mac\x20ha\x20una\x20disposizione\x20a\x20pannelli:\x20in\x20alto\x20trasporto\x20e\x20display,\x20al\x20centro\x20brano,\x20grafici,\x20marker\x20e\x20tempo\x20fisso,\x20a\x20destra\x20il\x20pannello\x20delle\x20impostazioni\x20(tempo,\x20battuta,\x20suono,\x20mixer,\x20sincronia\x20LED,\x20esportazioni),\x20in\x20basso\x20la\x20barra\x20di\x20stato.</p>\x0a<p>Al\x20centro\x20la\x20<b>timeline\x20a\x20tracce</b>,\x20tutte\x20con\x20lo\x20stesso\x20zoom:\x20righello\x20con\x20battute,\x20marker\x20(trascinabili)\x20e\x20loop;\x20audio;\x20click\x20(accenti\x20in\x20rosso);\x20andamento\x20BPM\x20(con\x20l\x27Editor\x20del\x20click\x20aperto);\x20<b>mappa\x20del\x20brano</b>\x20(clic\x20o\x20trascina\x20per\x20spostare\x20la\x20vista).\x20I\x20pulsanti\x20<b>M</b>\x20silenziano\x20audio\x20o\x20click\x20solo\x20nell\x27ascolto.\x20Sotto\x20i\x20nomi\x20delle\x20tracce\x20ci\x20sono\x20i\x20<b>VU\x20meter</b>\x20(audio\x20L\x20e\x20R,\x20click):\x20verde\x20fino\x20a\x20−12\x20dB,\x20giallo\x20fino\x20a\x20−3,\x20rosso\x20oltre;\x20la\x20tacca\x20indica\x20il\x20picco\x20e\x20il\x20quadratino\x20rosso\x20a\x20destra\x20si\x20accende\x20se\x20il\x20segnale\x20satura.\x20Misurano\x20quello\x20che\x20senti,\x20dopo\x20fader\x20e\x20mute.</p>\x0a<p>Con\x20un\x20video\x20c\x27è\x20anche\x20la\x20<b>traccia\x20video</b>\x20con\x20i\x20fotogrammi\x20in\x20miniatura\x20(⟳\x20ruota,\x20⧉\x20stacca).\x20Il\x20video\x20si\x20vede\x20in\x20alto\x20nel\x20pannello\x20di\x20destra;\x20<b>⧉\x20Stacca</b>\x20(o\x20⌥⌘V)\x20lo\x20mette\x20in\x20una\x20finestra\x20che\x20puoi\x20spostare\x20trascinando\x20l\x27intestazione\x20e\x20allargare\x20dall\x27angolo\x20in\x20basso\x20a\x20destra;\x20<b>⤓\x20Aggancia</b>\x20lo\x20rimette\x20a\x20posto.</p>\x0a<p>Anche\x20nella\x20<b>pagina\x20web\x20su\x20computer</b>\x20(ad\x20esempio\x20in\x20Chrome)\x20c\x27è\x20l\x27interfaccia\x20a\x20pannelli:\x20pulsante\x20<b>▦\x20Pannelli</b>\x20accanto\x20a\x20Guida;\x20per\x20tornare\x20indietro\x20<b>☰\x20Classica</b>\x20in\x20basso\x20a\x20destra.</p>\x0a<p>Se\x20preferisci\x20la\x20disposizione\x20di\x20sempre:\x20menu\x20<b>Vista\x20→\x20Interfaccia\x20classica</b>;\x20per\x20tornare\x20ai\x20pannelli\x20<b>Vista\x20→\x20Interfaccia\x20a\x20pannelli</b>.\x20La\x20scelta\x20resta\x20salvata\x20e\x20il\x20brano\x20aperto\x20si\x20riapre\x20da\x20solo.</p>\x0a<p><b>Altezza\x20delle\x20tracce</b>:\x20trascina\x20il\x20bordo\x20inferiore\x20del\x20nome\x20di\x20una\x20traccia\x20(colonna\x20di\x20sinistra)\x20per\x20alzarla\x20o\x20abbassarla;\x20doppio\x20clic\x20sul\x20nome\x20per\x20comprimerla\x20a\x20una\x20striscia\x20sottile\x20o\x20riaprirla.\x20<b>⌥\x20+\x20rotella</b>\x20sulla\x20traccia\x20Audio\x20ingrandisce\x20in\x20verticale\x20la\x20forma\x20d\x27onda\x20(utile\x20per\x20i\x20passaggi\x20piano).\x20<b>Vista\x20→\x20Ripristina\x20tracce</b>\x20torna\x20alle\x20misure\x20iniziali.\x20Le\x20altezze\x20restano\x20salvate.</p>'],['📲\x20Installare\x20e\x20aggiornare',lC(0x610)]],'en':[[lC(0x5da),lC(0xb57)],[lC(0x94a),'<p><b>What\x20ARNOCLICK\x20does.</b>\x20It\x20listens\x20to\x20an\x20audio\x20track\x20(or\x20a\x20video\x27s\x20audio),\x20finds\x20the\x20beats,\x20works\x20out\x20the\x20tempo\x20(BPM)\x20beat\x20by\x20beat\x20and\x20builds\x20a\x20click\x20that\x20follows\x20the\x20song:\x20you\x20can\x20play\x20it\x20with\x20the\x20music\x20and\x20export\x20it\x20as\x20audio\x20(.wav)\x20and\x20as\x20MIDI\x20with\x20a\x20tempo\x20map,\x20ready\x20for\x20your\x20sequencer.\x20Most\x20of\x20the\x20work\x20is\x20done\x20<b>automatically</b>.</p>\x0a<p><b>When\x20the\x20automatic\x20result\x20is\x20excellent.</b>\x20With\x20songs\x20whose\x20rhythm\x20is\x20fairly\x20steady:\x20recorded\x20to\x20a\x20click\x20or\x20with\x20steady\x20drums,\x20electronic\x20music,\x20songs\x20with\x20clear\x20attacks\x20(kick,\x20snare,\x20hi-hat,\x20rhythm\x20guitar,\x20bass).\x20In\x20these\x20cases\x20the\x20click\x20is\x20often\x20right\x20as\x20soon\x20as\x20the\x20analysis\x20is\x20done.</p>\x0a<p><b>When\x20post-production\x20is\x20needed.</b>\x20Some\x20songs\x20are\x20hard\x20for\x20any\x20automatic\x20analysis\x20and\x20will\x20probably\x20need\x20some\x20work\x20by\x20hand:</p>\x0a<ul><li>live\x20performances\x20with\x20speeding\x20up,\x20slowing\x20down\x20or\x20rubato;\x20free\x20intros\x20and\x20endings,\x20fermatas,\x20pauses;</li>\x0a<li>songs\x20without\x20drums\x20or\x20with\x20soft\x20attacks\x20(solo\x20piano,\x20strings,\x20voice,\x20pads),\x20or\x20with\x20lots\x20of\x20reverb;</li>\x0a<li>tempo\x20or\x20metre\x20changes,\x20triplets\x20and\x20swing,\x20strong\x20syncopation;</li>\x0a<li>noisy\x20or\x20heavily\x20compressed\x20recordings\x20(for\x20example\x20the\x20audio\x20of\x20a\x20phone\x20video),\x20fade-ins\x20and\x20fade-outs.</li></ul>\x0a<p>Typical\x20errors\x20are:\x20a\x20click\x20at\x20<b>double\x20or\x20half</b>\x20tempo,\x20a\x20click\x20on\x20the\x20<b>off-beat</b>,\x20the\x20<b>downbeat</b>\x20in\x20the\x20wrong\x20place,\x20<b>spikes</b>\x20in\x20the\x20tempo\x20graph\x20where\x20the\x20analysis\x20mistook\x20one\x20hit\x20for\x20another.\x20That\x20is\x20why\x20ARNOCLICK\x20has\x20post-production\x20tools:\x20<b>÷2\x20/\x20×2</b>,\x20a\x20typed\x20BPM\x20with\x20<b>Recalculate</b>,\x20moving\x20the\x20<b>downbeat</b>,\x20the\x20<b>Feel</b>\x20fader\x20(from\x20«follows\x20the\x20song»\x20to\x20«fixed\x20metronome»)\x20and\x20<b>Offset</b>,\x20<b>Analysis\x20resolution</b>\x20(triplets\x20included),\x20and\x20in\x20areas\x20set\x20with\x20the\x20orange\x20markers\x20the\x20click\x20<b>Smoothing</b>,\x20<b>Swings</b>\x20and\x20<b>Tempo</b>,\x20with\x20trial,\x20confirmation\x20and\x20an\x20<b>archive\x20of\x20changes</b>.\x20For\x20the\x20opposite,\x20bringing\x20the\x20music\x20onto\x20a\x20steady\x20tempo,\x20there\x20is\x20<b>⏱\x20Song\x20at\x20fixed\x20tempo</b>\x20(with\x20very\x20free\x20songs\x20the\x20alignment\x20may\x20leave\x20small\x20audible\x20artefacts:\x20always\x20listen\x20to\x20the\x20preview).</p>\x0a<p><b>Checking\x20by\x20ear\x20is\x20always\x20essential.</b>\x20The\x20graph\x20and\x20the\x20numbers\x20show\x20you\x20<i>where</i>\x20to\x20look,\x20but\x20your\x20ear\x20decides\x20whether\x20the\x20click\x20is\x20right.\x20Before\x20exporting,\x20listen\x20to\x20the\x20whole\x20song\x20with\x20the\x20click,\x20especially\x20the\x20start,\x20the\x20ending\x20and\x20tricky\x20passages:\x20use\x20the\x20<b>loop</b>\x20on\x20doubtful\x20spots\x20and\x20the\x20small\x20<b>▶</b>\x20that\x20plays\x20with\x20the\x20click\x20up\x20front\x20(music\x20lower,\x20click\x20louder).\x20Listen\x20on\x20<b>wired\x20headphones</b>\x20or\x20speakers:\x20Bluetooth\x20headphones\x20add\x20a\x20delay\x20that\x20misleads\x20you\x20(use\x20<b>LED\x20sync</b>\x20if\x20needed).\x20After\x20exporting,\x20also\x20check\x20in\x20your\x20sequencer\x20that\x20the\x20MIDI\x20click\x20lands\x20where\x20you\x20expect.</p>\x0a<p><b>Sometimes\x20the\x20right\x20feel\x20is\x20enough.</b>\x20The\x20click\x20does\x20not\x20have\x20to\x20match\x20every\x20hit\x20to\x20the\x20millisecond:\x20musicians\x20naturally\x20play\x20a\x20little\x20ahead\x20of\x20or\x20behind\x20the\x20beat,\x20and\x20differences\x20of\x20a\x20few\x20milliseconds\x20usually\x20go\x20unnoticed.\x20If,\x20playing\x20along,\x20the\x20click\x20«sits»,\x20neither\x20pushing\x20nor\x20dragging,\x20the\x20job\x20is\x20done\x20even\x20if\x20the\x20graph\x20is\x20not\x20perfectly\x20smooth.\x20Conversely,\x20a\x20clean\x20graph\x20does\x20not\x20guarantee\x20a\x20correct\x20click:\x20a\x20click\x20on\x20the\x20off-beat,\x20at\x20double\x20tempo\x20or\x20with\x20the\x20bar\x20shifted\x20can\x20look\x20perfect\x20and\x20still\x20sound\x20wrong.\x20Chasing\x20mathematical\x20perfection\x20on\x20a\x20live\x20performance\x20often\x20makes\x20things\x20worse:\x20better\x20a\x20click\x20that\x20follows\x20the\x20song\x27s\x20breathing\x20naturally.</p>\x0a<p><b>A\x20suggested\x20order\x20of\x20work</b>:\x20①\x20check\x20that\x20the\x20average\x20BPM\x20is\x20plausible\x20(otherwise\x20÷2\x20/\x20×2);\x20②\x20set\x20the\x20bar\x20and\x20downbeat\x20by\x20watching\x20the\x20red\x20LED;\x20③\x20listen\x20to\x20the\x20whole\x20song\x20and\x20note\x20doubtful\x20spots;\x20④\x20fix\x20any\x20overall\x20early\x20or\x20late\x20click\x20with\x20Offset;\x20⑤\x20work\x20only\x20on\x20the\x20areas\x20that\x20need\x20it;\x20⑥\x20listen\x20again,\x20export\x20and\x20check\x20in\x20your\x20sequencer.</p>'],[lC(0x7ea),'<p>Drop\x20a\x20file\x20onto\x20the\x20box\x20at\x20the\x20top,\x20or\x20tap\x20it\x20to\x20choose\x20one.\x20Audio\x20(WAV,\x20AIFF,\x20MP3,\x20M4A)\x20and\x20video\x20(MP4,\x20MOV)\x20files\x20work.\x20ARNOCLICK\x20analyses\x20the\x20rhythm;\x20a\x20bar\x20shows\x20the\x20stage\x20and\x20the\x20time\x20left.</p>\x0a<p>Then\x20press\x20<b>▶\x20PLAY</b>:\x20you\x20hear\x20the\x20song\x20with\x20the\x20click.\x20<b>⏮</b>\x20goes\x20back\x20to\x20the\x20start,\x20the\x20space\x20bar\x20(on\x20the\x20Mac)\x20plays/pauses.</p>\x0a<p><b>🕘\x20Recent</b>\x20lists\x20the\x20last\x2030\x20songs:\x20tap\x20one\x20to\x20reopen\x20it\x20with\x20all\x20its\x20settings.\x20«Select\x20again»\x20means\x20the\x20file\x20isn\x27t\x20stored\x20on\x20the\x20device:\x20pick\x20it\x20again\x20from ts\x20Start\x20to\x20End;\x20press\x20it\x20again\x20to\x20turn\x20it\x20off.\x20Tapping\x20the\x20tracks\x20while\x20playing\x20continues\x20from\x20there:\x20before\x20Start\x20it\x20plays\x20up\x20to\x20the\x20loop\x20and\x20then\x20loops.</p>'],['🎬\x20Video',lC(0x474)],['💾\x20Exports','<p>The\x20Export\x20box\x20has\x20three\x20groups:\x20<b>Corrected\x20click</b>\x20(with\x20all\x20active\x20changes,\x20Trend\x20and\x20Alignment),\x20<b>Song\x20with\x20the\x20click</b>\x20and\x20<b>Project</b>.</p><ul><li><b>🎹\x20Corrected\x20click\x20MIDI\x20(.mid)</b>:\x20with\x20a\x20tempo\x20map,\x20every\x20click\x20lands\x20on\x20the\x20sequencer\x20grid;\x20markers\x20included.</li>\x0a<li><b>Song\x20mixed\x20with\x20click\x20(.wav)</b>:\x20stereo,\x20at\x20the\x20Music\x20and\x20Click\x20fader\x20levels.</li>\x0a<li><b>💾\x20Corrected\x20click\x20audio\x20(.wav)</b>:\x20click\x20only,\x20same\x20length\x20as\x20the\x20song.</li>\x0a<li><b>Music\x20L\x20+\x20click\x20R\x20(.wav)</b>:\x20music\x20left,\x20click\x20right.</li>\x0a<li><b>📦\x20Full\x20project\x20(.zip)</b>:\x20one\x20file\x20with\x20the\x20original\x20song\x20(audio\x20or\x20video)\x20and\x20all\x20its\x20settings:\x20tempo,\x20bar,\x20accent,\x20markers\x20and\x20loop,\x20offset,\x20video\x20rotation,\x20levels\x20and\x20click\x20sound.\x20You\x20can\x20also\x20export\x20it\x20from\x20<b>Recent</b>\x20with\x20the\x20📦\x20button.\x20Send\x20it\x20to\x20your\x20collaborator\x20(WhatsApp,\x20e-mail,\x20AirDrop):\x20they\x20open\x20it\x20in\x20ARNOCLICK\x20like\x20a\x20normal\x20song\x20(drag\x20it\x20in\x20or\x20choose\x20it)\x20and\x20find\x20everything\x20as\x20you\x20left\x20it.</li></ul>\x0a<p>On\x20iPhone\x20and\x20iPad\x20the\x20file\x20is\x20saved\x20from\x20the\x20Share\x20sheet\x20(«Save\x20to\x20Files»).</p>'],[lC(0x8c2),lC(0x59e)],[lC(0xaa9),'<p><b>Light\x20mode</b>\x20(Mac\x20app,\x20<b>View</b>\x20menu):\x20on\x20old\x20Macs\x20it\x20lightens\x20the\x20app\x20(fewer\x20frames\x20per\x20second,\x20n
