<style>
:root{--bg:#0d0e10;--c1:#2b2e33;--c2:#1e2024;--edge:#3b3f46;--tx:#eceef0;--dim:#8a909a;--amb:#ffb21e;--red:#ff4530;--cy:#35d0ff;--new:#ff5fd2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(180deg,var(--c1),var(--c2));border-bottom:1px solid var(--edge)}
header.bar{padding-top:calc(env(safe-area-inset-top) + 6px);padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
.wm{font-weight:900;font-size:12px;letter-spacing:.05em;padding:7px 8px;border-radius:8px;background:linear-gradient(180deg,#0a0403,#140806);
 box-shadow:inset 0 2px 5px rgba(0,0,0,.9),inset 0 0 0 1px #000;line-height:1;white-space:nowrap}
.wm small{display:block;font-size:9px;font-weight:600;color:var(--dim);letter-spacing:.08em;margin-top:3px;text-align:center}
.wm .a{color:var(--amb);text-shadow:0 0 10px rgba(255,178,30,.5)}.wm .b{color:var(--cy);text-shadow:0 0 10px rgba(53,208,255,.5)}
.hb{min-height:36px;min-width:36px;padding:0 9px;border-radius:9px;border:1px solid #4b5058;border-bottom:2px solid #121316;
 background:linear-gradient(180deg,#41454d,#2b2e34);color:var(--tx);font:inherit;font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap}
.hb:disabled{opacity:.38;cursor:default}
.hb.on{background:linear-gradient(180deg,#7fe3ff,#1aa4d6);color:#04161d;border-color:#9be9ff;border-bottom-color:#0b4d63}
.hb.amb{background:linear-gradient(180deg,#ffc44d,#e89a00);color:#1b1305;border-color:#ffcf6b;border-bottom-color:#7a5000}
#target{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13px;padding:0 7px}
#target small{color:var(--dim);font-weight:500}
.seg{display:flex;gap:0}
.seg .hb{border-radius:0;margin-left:-1px}.seg .hb:first-child{border-radius:9px 0 0 9px;margin-left:0}.seg .hb:last-child{border-radius:0 9px 9px 0}
.sp{flex:1}

#crumb.show{display:flex}
#crumb .ck{color:var(--amb);background:none;border:0;font:inherit;font-weight:650;padding:4px 2px;cursor:pointer}
#crumb .ck.cur{color:var(--tx)}
#crumb .gt{color:var(--dim)}
#wrap{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;background:#08090a}
#stage{position:relative;margin:0 auto}
#fbox{position:absolute;overflow:hidden;background:#000;box-shadow:0 0 0 1px #3b3f46,0 10px 40px #000;border-radius:6px}
#F{border:0;position:absolute;left:0;top:0;transform-origin:0 0;background:#0d0e10}
#ov{position:absolute;touch-action:pan-x pan-y;background-repeat:repeat}

.bx{position:absolute;outline:1px dashed rgba(53,208,255,.6);outline-offset:-1px;cursor:pointer}
.bx.pn{outline:2px solid rgba(255,178,30,.75)}
.bx.sel{outline:2px solid var(--cy);background:rgba(53,208,255,.10);touch-action:none;z-index:5;cursor:move}
.bx.nw{outline-color:var(--new)}
.bx .tg{position:absolute;left:0;top:0;background:var(--amb);color:#1b1305;font:700 10px/1 -apple-system,Helvetica,Arial,sans-serif;padding:2px 5px;opacity:.92;
 border-radius:0 0 6px 0;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bx .tg .nm{display:inline-block;background:#1b1305;color:var(--amb);border-radius:3px;padding:1px 4px;margin-right:5px}
.bx.sel .tg{background:var(--cy);color:#04161d}
.bx .na.cut{left:0;right:auto;background:var(--red);color:#fff}
.bx .na{position:absolute;right:0;bottom:0;background:var(--new);color:#2a0020;font:700 10px/1 -apple-system,Helvetica,Arial,sans-serif;padding:3px 5px;pointer-events:none;white-space:nowrap}
.bx i{position:absolute;background:var(--cy);border:2px solid #04161d;touch-action:none;box-shadow:0 1px 4px #000}
.bx i[data-h=r],.bx i[data-h=l]{top:50%;width:16px;height:34px;margin-top:-17px;border-radius:6px;cursor:ew-resize}
.bx i[data-h=r]{right:-8px}.bx i[data-h=l]{left:-8px}
.bx i[data-h=t],.bx i[data-h=b]{left:50%;width:34px;height:16px;margin-left:-17px;border-radius:6px;cursor:ns-resize}
.bx i[data-h=b]{bottom:-8px}.bx i[data-h=t]{top:-8px}
.bx i::after{content:"";position:absolute;inset:-9px}
.bx i.co{width:24px;height:24px;border-radius:50%;background:var(--amb);z-index:2}
.bx i[data-h=br]{right:-12px;bottom:-12px;cursor:nwse-resize}.bx i[data-h=tl]{left:-12px;top:-12px;cursor:nwse-resize}
.bx i[data-h=tr]{right:-12px;top:-12px;cursor:nesw-resize}.bx i[data-h=bl]{left:-12px;bottom:-12px;cursor:nesw-resize}
.bx.small i[data-h=t],.bx.small i[data-h=b]{width:18px;margin-left:-9px}
.bx.small i[data-h=l],.bx.small i[data-h=r]{height:18px;margin-top:-9px}
.bx .dm{position:absolute;left:0;top:100%;margin-top:6px;background:#04161d;color:var(--cy);font:600 11px/1 Menlo,monospace;padding:4px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
.ct{position:absolute;outline:2px dashed var(--amb);pointer-events:none;background:rgba(255,178,30,.05)}
.scr{position:absolute;left:0;right:0;border-top:2px dashed rgba(255,69,48,.75);pointer-events:none;z-index:3}
.scr span{position:absolute;right:4px;top:2px;color:#fff;font:600 10px/1 -apple-system,Helvetica,Arial,sans-serif;background:rgba(255,69,48,.8);padding:3px 5px;border-radius:4px}
#zoom{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 70px);display:flex;gap:4px;z-index:20}
#zoom .hb{min-height:34px;font-size:13px;box-shadow:0 2px 10px #000}
#zl{min-width:52px}
#zord{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 112px);display:none;gap:4px;z-index:20;align-items:center;background:rgba(4,22,29,.85);border:1px solid #1aa4d6;border-radius:12px;padding:4px}
#zord.show{display:flex}
#zord .hb{min-height:36px;min-width:40px;font-size:17px}
#zlv{color:var(--cy);font:600 12px/1.1 -apple-system,Helvetica,Arial,sans-serif;padding:0 4px;text-align:center}
footer.bar{border-top:1px solid var(--edge);border-bottom:0;padding-bottom:calc(env(safe-area-inset-bottom) + 6px);justify-content:space-between}
footer .hb{flex:1;min-width:0;padding:0 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px;line-height:1.1}
footer .hb b{font-size:17px;font-weight:600}
#useMsg{display:none;flex:1;text-align:center;color:var(--dim);font-size:13px;padding:6px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);background:rgba(8,9,10,.85);z-index:30;text-align:center;padding:20px}
#load[hidden]{display:none}
/* foglio in basso */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100}
#sheet.open{display:flex}
.sb{background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--edge);border-bottom:0;width:100%;max-width:560px;max-height:86%;
 border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px #000}
.sh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--edge)}
.sh .t{flex:1;font-weight:750;font-size:16px}
.sc{overflow:auto;padding:12px 14px calc(env(safe-area-inset-bottom) + 16px);-webkit-overflow-scrolling:touch}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b9bec6;font-weight:650;margin:14px 0 6px;display:block}
.lbl:first-child{margin-top:0}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;margin:0 0 6px;border-radius:10px;border:1px solid #3b3f46;
 background:#20232a;color:var(--tx);font:inherit;cursor:pointer}
.opt.on{border-color:var(--cy);background:#10303b}
.opt small{color:var(--dim);display:block;font-size:12px;margin-top:2px}
.opt .ic{font-size:20px;width:28px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.fld input[type=number],.fld input[type=text],.fld select{background:#0a0b0d;color:var(--tx);border:1px solid #3b3f46;border-radius:8px;padding:9px 8px;font-size:16px;width:100%}
.fld .cl{display:flex;gap:6px;align-items:center}
.fld input[type=color]{width:52px;height:40px;border:1px solid #3b3f46;border-radius:8px;background:#0a0b0d;padding:2px}
.rs{background:none;border:1px solid #3b3f46;color:var(--dim);border-radius:8px;min-height:36px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
textarea.out{width:100%;min-height:180px;background:#0a0b0d;color:#d6dbe2;border:1px solid #3b3f46;border-radius:8px;padding:8px;font:12px/1.4 Menlo,monospace}
textarea.nt{width:100%;min-height:60px;background:#0a0b0d;color:var(--tx);border:1px solid #3b3f46;border-radius:8px;padding:8px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hint{color:var(--dim);font-size:13px;line-height:1.45}
.hint b{color:var(--tx)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #2c3038}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .hb{min-width:46px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 166px);transform:translateX(-50%);background:#04161d;color:var(--cy);border:1px solid #1aa4d6;
 padding:9px 14px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="wm"><span class="a">ARNO</span><span class="b">CANVAS</span><small id="verS"></small></div>
    <button class="hb" id="target">…</button>
    <button class="hb" id="undoB" disabled aria-label="Annulla">↶</button>
    <button class="hb" id="redoB" disabled aria-label="Ripeti">↷</button>
    <button class="hb" id="menuB" aria-label="Menu">☰</button>
  </header>
  <div class="bar">
    <div class="seg">
      <button class="hb" data-l="P">① Riquadri</button>
      <button class="hb" data-l="O">② Oggetti</button>
      <button class="hb" data-l="U">▶ Usa</button>
    </div>
    <span class="sp"></span>
    <button class="hb" id="gridB">▦</button>
  </div>
  <div id="crumb"></div>
  <div id="wrap">
    <div id="stage"><div id="fbox"><iframe id="F" title="App da modificare"></iframe></div><div id="ov"></div></div>
    <div id="load">Carico…</div>
  </div>
  <div id="zord"><button class="hb" data-z="bot" title="In fondo">⤓</button><button class="hb" data-z="down" title="Porta sotto">↓</button><button class="hb" data-z="up" title="Porta sopra">↑</button><button class="hb" data-z="top" title="In primo piano">⤒</button><span id="zlv"></span></div>
  <div id="zoom"><button class="hb" id="zM">−</button><button class="hb" id="zl">100%</button><button class="hb" id="zP">＋</button></div>
  <footer class="bar">
    <button class="hb" id="bNew"><b>＋</b>Nuovo</button>
    <button class="hb" id="bDup"><b>⧉</b>Duplica</button>
    <button class="hb" id="bDel"><b>🗑</b>Elimina</button>
    <button class="hb" id="bProp"><b>🎨</b>Aspetto</button>
    <button class="hb" id="bIn"><b>⤵</b>Entra</button>
    <div id="useMsg">Stai usando l'app: i comandi funzionano davvero.<br>Torna a ① o ② per modificare.</div>
  </footer>
</div>
<div id="sheet"><div class="sb"><div class="sh"><span class="t" id="shT"></span><button class="hb" id="shX">Chiudi</button></div><div class="sc" id="shC"></div></div></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var VER='0.3.2';
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}

/* app modificabili: tutte sullo stesso sito, così si possono leggere da dentro */
var APPS=[
 {k:'arnovideo',n:'ARNOVIDEO',u:'../arnovideo/',d:'versione di prova',panels:['main > .brand','main > section.rack','main > footer']},
 {k:'arnoclick',n:'ARNOCLICK',u:'../arnoclick/',d:'versione di prova',panels:['main .rack:not(#helpPanel)','main > footer']},
 {k:'arnodesign',n:'ARNODESIGN',u:'../arnodesign/',d:'versione di prova',fixed:true,panels:['#app > header','#canvasWrap','#palette','#props','#app > footer'],
  names:{'#canvasWrap':'Area di lavoro','#palette':'Elementi','#props':'Proprietà','#app > footer':'Barra dei comandi'}}
];
var DEVS=[
 {k:'iphone15',n:'iPhone 15',w:393,h:852,ic:'📱'},
 {k:'ipad105',n:'iPad Pro 10,5″',w:834,h:1112,ic:'⬛'},
 {k:'ipad129',n:'iPad Pro 12,9″',w:1024,h:1366,ic:'⬛'},
 {k:'mac13',n:'Mac 13″',w:1280,h:800,ic:'💻'},
 {k:'mac15',n:'Mac 15″',w:1440,h:900,ic:'💻'}
];
var KN={panel:'Riquadro nuovo',button:'Pulsante nuovo',text:'Scritta nuova',display:'Display nuovo',slider:'Cursore nuovo',select:'Menu nuovo',row:'Riga nuova',clone:'Copia'};

function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S=Object.assign({app:'arnovideo',dev:'iphone15',lvl:'P',grid:8,snap:true,showGrid:true,zoom:0},lsGet('arnocanvas:set',{}));
function saveSet(){lsSet('arnocanvas:set',{app:S.app,dev:S.dev,lvl:S.lvl,grid:S.grid,snap:S.snap,showGrid:S.showGrid,zoom:S.zoom})}
function A(){for(var i=0;i<APPS.length;i++)if(APPS[i].k===S.app)return APPS[i];return APPS[0]}
function DV(){for(var i=0;i<DEVS.length;i++)if(DEVS[i].k===S.dev)return DEVS[i];return DEVS[0]}
function mkey(){return 'arnocanvas:m:'+S.app+':'+S.dev}
function blank(){return {v:1,frozen:false,P:{},I:{},N:[],seq:1}}

var F=$('#F'),ov=$('#ov'),stage=$('#stage'),wrap=$('#wrap'),fbox=$('#fbox');
var W=null,D=null,ready=false,M=blank(),ORIG={},CB={},PANELS=[],BOXES=[],CONTR=null;
var sel=null,cont=null,H=852,Z=1,PAD=14,hist=[],redo=[],drag=null,tap=null,lastTap={},IND=false;
try{IND=CSS.supports('translate','1px')&&CSS.supports('scale','1')}catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cut(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function r1(v){return Math.round(v*10)/10}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
var toastT;function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on')},2600)}

/* ---------- riferimenti stabili agli elementi dell'app ---------- */
function isNew(el){return !!(el&&el.nodeType===1&&el.hasAttribute('data-cvn'))}
function refOf(el){
  if(!el||el===D.body)return 'body';
  if(el===D.documentElement)return 'html';
  if(isNew(el))return '@'+el.getAttribute('data-cvn');
  if(el.id&&!el.closest('[data-cvn]')&&/^[A-Za-z][\w-]*$/.test(el.id)&&D.querySelectorAll('#'+el.id).length===1)return '#'+el.id;
  var p=el.parentElement,i=0;if(!p)return 'body';
  for(var c=p.firstElementChild;c&&c!==el;c=c.nextElementSibling)if(c.tagName===el.tagName&&!isNew(c))i++;
  return refOf(p)+'/'+el.tagName.toLowerCase()+'['+i+']';
}
function resolve(ref){
  if(!D||!ref)return null;
  var parts=ref.split('/'),h=parts[0],el=null;
  if(h==='body')el=D.body;else if(h==='html')el=D.documentElement;
  else if(h[0]==='#')el=D.getElementById(h.slice(1));
  else if(h[0]==='@')el=D.querySelector('[data-cvn="'+h.slice(1)+'"]');
  for(var k=1;k<parts.length&&el;k++){
    var m=parts[k].match(/^([a-z0-9-]+)\[(\d+)\]$/i);if(!m)return null;
    var i=+m[2],f=null,tg=m[1].toUpperCase();
    for(var c=el.firstElementChild;c;c=c.nextElementSibling){if(c.tagName.toUpperCase()===tg&&!isNew(c)){if(i===0){f=c;break}i--}}
    el=f;
  }
  return el;
}
function relPath(root,el){var s='';while(el&&el!==root){var p=el.parentElement,i=0;for(var c=p.firstElementChild;c&&c!==el;c=c.nextElementSibling)if(c.tagName===el.tagName&&!isNew(c))i++;s='/'+el.tagName.toLowerCase()+'['+i+']'+s;el=p}return s}

/* ---------- nomi leggibili ---------- */
function txt(el){return ((el&&el.textContent)||'').replace(/\s+/g,' ').trim()}
function panelName(el){
  var nm=A().names;if(nm)for(var q in nm){try{if(el.matches(q))return nm[q]}catch(e){}}
  if(el.querySelector('.wordmark')||el.classList.contains('brand')&&el.tagName!=='DIV'||el.tagName==='HEADER')return 'Intestazione';
  if(el.classList.contains('brand')||el.querySelector(':scope > .brand'))return 'Intestazione';
  if(el.tagName==='FOOTER')return 'Piè di pagina';
  var l=el.querySelector('.lbl,h1,h2,h3,.dt');var t=l?txt(l):'';
  if(!t)t=el.id?el.id:'Riquadro';
  return cut(t,34);
}
function objName(el){
  var tg=el.tagName,t=txt(el),a=el.getAttribute('aria-label')||el.getAttribute('title')||'',cl=el.classList;
  if(tg==='BUTTON')return 'Pulsante «'+cut(t||a,22)+'»';
  if(tg==='SELECT')return 'Menu «'+cut(el.options&&el.options[el.selectedIndex]?el.options[el.selectedIndex].text:'',22)+'»';
  if(tg==='INPUT')return el.type==='range'?'Cursore':'Campo';
  if(tg==='CANVAS')return 'Area grafica'+(el.id?' '+el.id:'');
  if(tg==='LABEL')return 'Voce «'+cut(t,22)+'»';
  if(cl.contains('lcd'))return 'Display «'+cut(t,16)+'»';
  if(cl.contains('lbl'))return 'Scritta «'+cut(t,22)+'»';
  if(tg==='P')return 'Nota «'+cut(t,22)+'»';
  if(a)return cut(a,28);
  if(t&&t.length<=24&&!el.children.length)return '«'+t+'»';
  return 'Gruppo'+(el.id?' '+el.id:'')+(t?' «'+cut(t,18)+'»':'');
}
function isPanelEl(el){for(var i=0;i<PANELS.length;i++)if(PANELS[i].el===el)return true;return false}
function nameAt(ref){var el=resolve(ref);if(!el)return ref;return isPanelEl(el)?panelName(el):objName(el)}
function panelOf(el){while(el&&!isPanelEl(el))el=el.parentElement;return el}

/* ---------- stili: salva l'originale e applica le modifiche ---------- */
function imp(st,k,v){st.setProperty(k,v,'important')}
function touch(ref,el){if(!ORIG[ref])ORIG[ref]={st:el.getAttribute('style'),html:null}}
function restoreOne(ref){var o=ORIG[ref],el=resolve(ref);if(!o||!el)return;if(o.html!=null)el.innerHTML=o.html;if(o.st==null)el.removeAttribute('style');else el.setAttribute('style',o.st)}
function restoreAll(){

function stackList(){ // dal più sotto al più sopra, come li disegna il browser
  return BOXES.map(function(b,i){return {b:b,i:i,z:zOf(b)}}).sort(function(a,c){return a.z-c.z||a.i-c.i}).map(function(x){return x.b});

function zMove(k){

  '<span class="lbl">Griglia ▦</span><p class="hint">Passo regolabile, aggancio acceso o movimento libero.</p>'+
  '<span class="lbl">Elementi nuovi e copie</span><p class="hint">Hanno l\'aspetto giusto ma nessuna funzione: sono segnati in rosa «da assegnare».</p>'+
  '<span class="lbl">Quando hai finito</span><p class="hint">☰ › <b>Invia le modifiche a Claude</b>: copia e incolla in chat. Claude le applica alla versione di prova dell\'app.</p>');
}

/* ---------- riepilogo per Claude ---------- */
function descI(it){
  var c=[];
  if(it.hide)c.push('eliminato');
  if(it.dx||it.dy)c.push('spostato di '+(it.dx>0?'+':'')+(it.dx||0)+', '+(it.dy>0?'+':'')+(it.dy||0));
  if(it.w!=null)c.push('larghezza '+it.w);
  if(it.h!=null)c.push('altezza '+it.h);
  if(it.s&&it.s!==1)c.push('scala '+Math.round(it.s*100)+'%');
  if(it.txt!=null)c.push('testo «'+it.txt+'»');
  if(it.bg)c.push('sfondo '+it.bg);
  if(it.fg)c.push('colore testo '+it.fg);
  if(it.rad!=null)c.push('angoli '+it.rad+' px');
  if(it.fs)c.push('testo '+it.fs+' px');
  if(it.op!=null)c.push('opacità '+Math.round(it.op*100)+'%');
  return c;
}
function claudeText(note){
  var a=A(),d=DV(),pan=[],obj=[],nw=[],names={};
  function nm(r){var n=nameAt(r);names[r]=n;var e=resolve(r);return e&&isPanelEl(e)?'riquadro «'+n+'»':n}
  function where(r){var e=resolve(r);var p=e?panelOf(e):null;return p&&p!==e?' (riquadro «'+panelName(p)+'»)':''}
  M.N.forEach(function(n){var r='@'+n.id,e=resolve(r);
    var what=n.kind==='clone'?'Copia di '+nm(n.of):KN[n.kind]+(e&&txt(e)?' «'+cut(txt(e),24)+'»':'');
    var extra=[];if(M.P[r])extra.push('posizione x '+Math.round(M.P[r].x)+', y '+Math.round(M.P[r].y)+', larghezza '+Math.round(M.P[r].w)+(M.P[r].s&&M.P[r].s!==1?', scala '+Math.round(M.P[r].s*100)+'%':''));
    if(M.I[r])extra=extra.concat(descI(M.I[r]));
    nm(r);nw.push(what+(n.par?' dentro '+nm(n.par):'')+(extra.length?': '+extra.join('; '):'')+' — FUNZIONE DA ASSEGNARE')});
  Object.keys(M.P).forEach(function(r){if(r[0]==='@')return;var P=M.P[r],c=[];
    if(Math.round(P.x)!==Math.round(P.x0)||Math.round(P.y)!==Math.round(P.y0))c.push('posizione x '+Math.round(P.x)+', y '+Math.round(P.y)+' (prima '+Math.round(P.x0)+', '+Math.round(P.y0)+')');
    if(Math.round(P.w)!==Math.round(P.w0))c.push('larghezza '+Math.round(P.w)+' (prima '+Math.round(P.w0)+')');
    if(P.s&&P.s!==1)c.push('scala '+Math.round(P.s*100)+'%');
    if(P.mh&&Math.round(P.mh)!==Math.round(P.h0||0))c.push('altezza '+Math.round(P.mh)+(P.h0?' (prima '+Math.round(P.h0)+')':''));
    if(c.length)pan.push(nm(r)+': '+c.join('; '))});
  Object.keys(M.I).forEach(function(r){if(r[0]==='@')return;var c=descI(M.I[r]);if(!c.length)return;var e=resolve(r),isP=e&&isPanelEl(e);
    (isP?pan:obj).push(nm(r)+(isP?'':where(r))+': '+c.join('; '))});
  var zg={},zl=[];
  Object.keys(M.I).forEach(function(r){if(M.I[r].z==null)return;var e=resolve(r);if(!e||!e.parentElement)return;var isP=isPanelEl(e),k=isP?'P':refOf(e.parentElement);(zg[k]||(zg[k]=[])).push({r:r,z:M.I[r].z,isP:isP})});
  Object.keys(zg).forEach(function(k){var g=zg[k].sort(function(a,b){return a.z-b.z});if(g.length<2)return;
    zl.push((k==='P'?'Riquadri':'Dentro '+nm(k))+', dal più sotto al più sopra: '+g.map(function(x){return x.isP?'«'+nameAt(x.r)+'»':nameAt(x.r)}).join(' → '))});
  var L=['Ciao Claude, ecco le modifiche fatte con ARNOCANVAS '+VER+'.','App: '+a.n+' ('+a.d+') · Schermo: '+d.n+' ('+d.w+'×'+d.h+')',''];
  var k=0;
  if(pan.length){L.push('RIQUADRI');pan.forEach(function(x){L.push((++k)+'. '+x)});L.push('')}
  if(obj.length){L.push('OGGETTI');obj.forEach(function(x){L.push((++k)+'. '+x)});L.push('')}
  if(zl.length){L.push('LIVELLI (SOPRA / SOTTO)');zl.forEach(function(x){L.push((++k)+'. '+x)});L.push('')}
  if(nw.length){L.push('ELEMENTI NUOVI O COPIATI');nw.forEach(function(x){L.push((++k)+'. '+x)});L.push('')}
  if(!k)L.push('(Nessuna modifica)','');
  if(note)L.push('Nota mia: '+note,'');
  L.push('Applicale alla versione di prova di '+a.n+'.','','---ARNOCANVAS-DATI---',JSON.stringify({arnocanvas:VER,app:a.k,dev:d.k,w:d.w,h:d.h,model:M,names:names}),'---FINE---');
  return {t:L.join('\n'),n:k};
}
function showClaude(){
  var r=claudeText('');
  var h='<p class="hint">Ho trovato <b>'+r.n+' modific'+(r.n===1?'a':'he')+'</b>. 1) Se vuoi aggiungi una frase tua. 2) Tocca <b>Copia</b>. 3) Incolla nella chat con Claude.</p>';
  h+='<textarea class="nt" id="cNote" placeholder="Es.: la timeline la voglio più in alto anche su iPad"></textarea>';
  h+='<div class="row"><button class="hb amb" id="cCopy">📋 Copia</button></div><span class="lbl">Testo che verrà copiato</span><textarea class="out" id="cOut" readonly>'+esc(r.t)+'</textarea>';
  openSheet('Invia a Claude',h,function(c){
    c.querySelector('#cNote').addEventListener('input',function(){c.querySelector('#cOut').value=claudeText(this.value.trim()).t});
    c.querySelector('#cCopy').onclick=function(){var t=c.querySelector('#cOut').value;copy(t,c.querySelector('#cOut'))};
  });
}
function copy(t,ta){
  function fb(){try{ta.removeAttribute('readonly');ta.focus();ta.select();ta.setSelectionRange(0,t.length);var ok=document.execCommand('copy');ta.setAttribute('readonly','');toast(ok?'Copiato! Ora incollalo nella chat con Claude':'Seleziona il testo e copialo a mano')}catch(e){toast('Seleziona il testo e copialo a mano')}}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Copiato! Ora incollalo nella chat con Claude')},fb);else fb();
}
function showImport(){
  openSheet('Importa modifiche','<p class="hint">Incolla qui un riepilogo ARNOCANVAS (anche uno preparato da Claude). Sostituisce le modifiche attuali di quella app e di quello schermo.</p><textarea class="out" id="iTxt" style="-webkit-user-select:text;user-select:text" placeholder="Incolla qui…"></textarea><div class="row"><button class="hb amb" id="iGo">Importa</button></div>',function(c){
    c.querySelector('#iGo').onclick=function(){
      var t=c.querySelector('#iTxt').value||'',i=t.indexOf('---ARNOCANVAS-DATI---'),j;
      if(i>=0){t=t.slice(i+21);j=t.indexOf('---FINE---');if(j>=0)t=t.slice(0,j)}
      var s0=t.indexOf('{'),e0=t.lastIndexOf('}');
      try{var o=JSON.parse(t.slice(s0,e0+1));if(!o.model||!o.app)throw 0;
        lsSet('arnocanvas:m:'+o.app+':'+(o.dev||S.dev),o.model);S.app=o.app;if(o.dev)S.dev=o.dev;saveSet();closeSheet();loadApp();toast('Modifiche importate')}
      catch(e){toast('Non riconosco questo testo')}
    };
  });
}

/* ---------- tastiera (Mac) ---------- */
document.addEventListener('keydown',function(e){
  if($('#sheet').classList.contains('open')||/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||''))return;
  var mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('#redoB'):$('#undoB')).onclick();return}
  if(!sel||S.lvl==='U')return;
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();$('#bDup').onclick();return}
  if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();$('#bDel').onclick();return}
  if(e.key==='Enter'){e.preventDefault();enter(sel);return}
  if(mod&&(e.key===']'||e.key==='[')){e.preventDefault();zMove(e.key===']'?(e.shiftKey?'top':'up'):(e.shiftKey?'bot':'down'));return}
  var dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(!dir)return;e.preventDefault();
  var st=(S.snap?S.grid:1)*(e.shiftKey?10:1);
  if(S.lvl==='P'){ensureFrozen();if(!M.P[sel])return;change(function(){M.P[sel].x+=dir[0]*st;M.P[sel].y+=dir[1]*st})}
  else change(function(){var t=M.I[sel]||(M.I[sel]={});t.dx=(t.dx||0)+dir[0]*st;t.dy=(t.dy||0)+dir[1]*st});
});

/* ---------- caricamento dell'app ---------- */
var poll=0,lastSig='';
function sig(){if(!D||!D.body)return '';var s=D.body.scrollHeight+'|';PANELS.forEach(function(p){var r=p.el.getBoundingClientRect();s+=Math.round(r.top)+','+Math.round(r.height)+','+Math.round(r.width)+';'});return s}
function loadApp(){
  ready=false;D=null;W=null;ORIG={};CB={};PANELS=[];BOXES=[];sel=null;cont=null;hist=[];redo=[];
  M=lsGet(mkey(),blank());if(!M||!M.I)M=blank();
  updTarget();updUndo();
  var d=DV();H=d.h;layoutStage();
  $('#load').hidden=false;$('#load').textContent='Carico '+A().n+' per '+d.n+'…';
  F.onload=function(){
    try{W=F.contentWindow;D=F.contentDocument;if(!D||!D.body)throw 0}
    catch(e){$('#load').textContent='Non riesco a leggere questa app: deve stare sullo stesso sito di ARNOCANVAS.';return}
    setTimeout(function(){
      ready=true;$('#load').hidden=true;
      applyAll();setLevel(S.lvl==='U'?'U':'P');updBar();updCrumb();
      wrap.scrollTop=0;
    },900);
  };
  F.src=A().u+'?arnocanvas='+Date.now();
}
clearInterval(poll);poll=setInterval(function(){if(!ready||drag||!D)return;var s=sig();if(s!==lastSig){lastSig=s;var n=PANELS.length;detectPanels();if(PANELS.length!==n||(M.frozen&&PANELS.some(function(p){return !M.P[p.ref]&&vis(p.el)}))){applyAll();return}sizeFrame();measure();render()}},800);

$('#verS').textContent='versione '+VER;
/* aggiornamento automatico: se sul sito c'è una versione più nuova, ricarica saltando la cache */
function vnum(v){return String(v).split('.').reduce(function(a,x){return a*1000+(+x||0)},0)}
function checkUpdate(){
  try{fetch(location.pathname+'?nocache='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
    var m=t.match(/var VER='([0-9.]+)'/);
    if(m&&vnum(m[1])>vnum(VER)){toast('Nuova versione '+m[1]+': aggiorno…');setTimeout(function(){location.replace(location.pathname+'?v='+m[1])},900)}
  }).catch(function(){})}catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkUpdate()});
updBar();loadApp();
})();
</script>
