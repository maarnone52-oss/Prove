<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARNODESIGN">
<title>ARNODESIGN</title>
<meta name="theme-color" content="#171a21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--p1:#171a21;--p2:#20242d;--line:#2c313c;--tx:#e8eaf0;--dim:#9aa1ad;--acc:#ff9f1c;--sel:#3fb6ff;--red:#ff5a5f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.3 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));background:var(--p1);border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-weight:800;letter-spacing:.4px;font-size:15px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--acc)}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--p2);border:1px solid var(--line);color:var(--tx);border-radius:9px;height:36px;min-width:38px;padding:0 10px;font-size:16px;white-space:nowrap}
.hb:disabled{opacity:.3}
#modeBtn{font-weight:700;font-size:14px}
@media (max-width:440px){header{gap:4px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}.hb{padding:0 7px;min-width:34px}.brand{font-size:13px}#modeBtn{font-size:13px}}
#modeBtn.play{background:var(--acc);color:#111;border-color:var(--acc)}
#main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#canvasWrap{flex:1;position:relative;min-height:120px;order:0}
#scroller{position:absolute;inset:0;overflow:auto;display:flex;padding:12px;-webkit-overflow-scrolling:touch;background:#0b0d11 radial-gradient(#1d212a 1px,transparent 1.4px) 0 0/14px 14px}
#holder{position:relative;margin:auto;flex:0 0 auto}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;box-shadow:0 0 0 1px #3a4150,0 10px 40px #000a;touch-action:pan-x pan-y}
#zoomBar{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;align-items:center;background:#000b;border-radius:10px;padding:4px;z-index:5}
#zoomBar button{background:var(--p2);border:1px solid var(--line);color:var(--tx);border-radius:7px;height:30px;min-width:32px;font-size:14px}
#zoomLbl{font-size:11px;color:var(--dim);min-width:36px;text-align:center}
.sheet{display:none;flex-direction:column;background:var(--p1);border-top:1px solid var(--line);min-height:0;order:1}
.sheet.open{display:flex;flex:0 0 44%}
.sh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:700}
.sh span{margin-right:auto}
.sb{overflow:auto;padding:6px 12px 18px;-webkit-overflow-scrolling:touch;flex:1}
.x{background:var(--p2);border:1px solid var(--line);color:var(--tx);border-radius:8px;height:30px;min-width:30px}
footer{display:flex;justify-content:space-around;background:var(--p1);border-top:1px solid var(--line);padding:4px;padding-bottom:max(4px,env(safe-area-inset-bottom));flex:0 0 auto}
.fb{background:none;border:0;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:20px;padding:4px 2px;min-width:50px;border-radius:8px}
.fb small{font-size:10px;color:var(--dim)}
.fb:disabled{opacity:.25}
.fb.main{color:var(--acc)}
body.wide #main{flex-direction:row}
body.wide #palette{display:flex;order:0;flex:0 0 236px;border-top:0;border-right:1px solid var(--line)}
body.wide #canvasWrap{order:1}
body.wide #props{display:flex;order:2;flex:0 0 330px;border-top:0;border-left:1px solid var(--line)}
body.wide .sheet .x,body.wide #fAdd,body.wide #fProps{display:none}
/* palette */
.pg h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;color:var(--dim);letter-spacing:.8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.tile{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;color:var(--tx);font-size:12px}
.tile i{display:block;font-style:normal;font-size:20px;color:var(--acc);margin-bottom:3px;height:24px}
.tile:active{background:#2a2f3a}
/* props */
.sec{font-size:11px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px;letter-spacing:.8px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;min-height:34px}
.row>label{flex:0 0 112px;color:var(--dim);font-size:13px}
.row input[type=text],.row input[type=number],.row select,.row textarea,.arow select,.arow input{flex:1;min-width:0;width:100%;background:var(--p2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 8px;font-size:16px;font-family:inherit}
.arow select,.arow input{background:var(--bg)}
.row textarea{resize:vertical}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
input[type=color]{width:46px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--p2);padding:2px}
.cnone{font-size:12px;color:var(--dim)}
.geo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.geo label{display:flex;flex-direction:column;font-size:11px;color:var(--dim);gap:2px}
.geo input{width:100%;background:var(--p2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 6px;font-size:16px}
.btn{background:var(--p2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:8px 12px;font-size:14px;display:inline-block}
.btn.small{padding:6px 10px;font-size:13px}
.btn.acc{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.btn.red{color:var(--red)}
.brow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.arow{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.arow .ar1{display:flex;gap:6px;align-items:center}
.arow .ar2{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim)}
.hint{color:var(--dim);font-size:13px;line-height:1.45}
.layer{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--p2);border:1px solid var(--line);border-radius:9px;margin:5px 0;font-size:14px}
.layer i{font-style:normal;color:var(--acc);width:20px;text-align:center}
.layer small{margin-left:auto;color:var(--dim)}
/* stage */
#stage .el{position:absolute;touch-action:none}
#stage.edit .el.locked,#stage.play .el{touch-action:pan-x pan-y}
#stage.play .el.t-slider,#stage.play .el.t-knob,#stage.play .el.t-timeline,#stage.play .el.t-grid{touch-action:none}
#stage.edit .el *{pointer-events:none}
#stage.edit .el.ghost{opacity:.35;outline:1px dashed #999}
#sel{position:absolute;outline:var(--bw) solid var(--sel);pointer-events:none;z-index:9999}
.hdl{position:absolute;width:var(--hs);height:var(--hs);transform:translate(-50%,-50%);pointer-events:auto;touch-action:none}
.hdl.rot{width:calc(var(--hs)*1.2);height:calc(var(--hs)*1.2)}
.hdl.rot:after{content:'↻';width:calc(var(--hd)*1.8);height:calc(var(--hd)*1.8);background:var(--sel);color:#fff;border-color:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--hd)*1.3);line-height:1}
.rline{position:absolute;left:50%;top:calc(-1*var(--rh));height:var(--rh);border-left:var(--bw) solid var(--sel);pointer-events:none}
.hdl:after{content:'';position:absolute;left:50%;top:50%;width:var(--hd);height:var(--hd);transform:translate(-50%,-50%);background:#fff;border:var(--bw) solid var(--sel);border-radius:50%;box-sizing:border-box}
.g-island{position:absolute;top:11px;width:126px;height:37px;border-radius:19px;background:#000;z-index:9000;pointer-events:none}
.g-home{position:absolute;width:134px;height:5px;border-radius:3px;background:#ffffff99;z-index:9000;pointer-events:none}
.g-line{position:absolute;left:0;right:0;border-top:1px dashed #3fb6ff66;z-index:8999;pointer-events:none}
.g-vline{position:absolute;top:0;bottom:0;border-left:1px dashed #3fb6ff66;z-index:8999;pointer-events:none}
#stage.play .g-line,#stage.play .g-vline{display:none}
.g-mac{position:absolute;left:0;right:0;top:0;height:28px;background:#24272e;border-bottom:1px solid #00000080;z-index:9000;display:flex;gap:8px;align-items:center;padding-left:12px;pointer-events:none}
.g-mac i{width:12px;height:12px;border-radius:50%}
/* widgets */
.w-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;overflow:hidden;box-shadow:inset 0 -2px 0 #0003;white-space:nowrap}
.w-btn span{white-space:normal;text-align:center;line-height:1.15}
.w-btn.on{box-shadow:0 0 0 3px #ffffffaa inset;filter:brightness(1.15)}
.el.press .w-btn{transform:scale(.95);filter:brightness(.8)}
.w-text{position:absolute;inset:0;display:flex;align-items:center;white-space:pre-wrap;overflow:hidden;line-height:1.15}
.w-counter{position:absolute;inset:0;display:flex;align-items:stretch;overflow:hidden}
.w-counter .cv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;gap:2px}
.w-counter small{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
.w-counter .cv span{font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.w-counter .pm{flex:0 0 24%;max-width:60px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#ffffff0d;font-weight:400}
.w-slider{position:absolute;inset:0}
.w-slider .tr{position:absolute;left:11px;right:11px;top:50%;height:6px;margin-top:-3px;border-radius:3px;overflow:hidden}
.w-slider .fi{height:100%}
.w-slider .th{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0009}
.w-slider.v .tr{top:11px;bottom:11px;left:50%;width:6px;height:auto;margin:0 0 0 -3px;display:flex;align-items:flex-end}
.w-slider.v .fi{width:100%}
.w-slider.v .th{left:50%;margin:0 0 0 -11px;top:auto}
.w-knob{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.w-knob .kl{white-space:nowrap;opacity:.85}
.w-toggle{position:absolute;inset:0;border-radius:999px}
.w-toggle i{position:absolute;top:3px;bottom:3px;left:3px;aspect-ratio:1/1;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0007}
.w-toggle.on i{left:auto;right:3px}
.w-select{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid #ffffff1a;white-space:nowrap;overflow:hidden}
.w-tabs{position:absolute;inset:0;display:flex;padding:3px;gap:3px}
.w-tabs div{flex:1;display:flex;align-items:center;justify-content:center;border-radius:6px;white-space:nowrap;overflow:hidden}
.w-list{position:absolute;inset:0;overflow:hidden}
.w-list div{padding:0 12px;display:flex;align-items:center;border-bottom:1px solid #ffffff12;white-space:nowrap;overflow:hidden}
.w-input{position:absolute;inset:0;border:1px solid #ffffff22;padding:0 10px;display:flex;align-items:center;width:100%;height:100%;outline:none;font-family:inherit}
.w-input.ph{opacity:.6}
.w-panel{position:absolute;inset:0}
.w-panel .pt{padding:8px 12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.w-img{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#ffffff88;font-size:12px;gap:4px;border:1px dashed #ffffff30}
.w-img img{width:100%;height:100%;object-fit:cover;display:block}
.w-img b{font-size:28px;font-weight:400}
.w-video{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.w-video .pl{width:52px;height:52px;border-radius:50%;background:#ffffff26;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.w-video span{position:absolute;left:10px;top:8px;font-size:12px;color:#ffffffaa}
.w-video .vb{position:absolute;left:10px;right:10px;bottom:10px;height:4px;border-radius:2px;background:#ffffff30}
.w-video .vb i{display:block;width:35%;height:100%;background:var(--acc);border-radius:2px}
.w-meter{position:absolute;inset:0;border-radius:3px;overflow:hidden}
.w-meter .mk{position:absolute;left:0;right:0;top:0;background:#0b0d11e8}
.w-meter.h .mk{left:auto;bottom:0}
.w-prog{position:absolute;inset:0;overflow:hidden}
.w-prog i{display:block;height:100%}
.w-tl{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid #ffffff14}
.w-tl .ru{height:18px;flex:0 0 18px;position:relative;border-bottom:1px solid #ffffff1a;margin-left:58px}
.w-tl .ru b{position:absolute;top:2px;font-weight:400;opacity:.6;border-left:1px solid #ffffff40;padding-left:3px;height:14px}
.w-tl .tk{flex:1;display:flex;border-bottom:1px solid #ffffff10;min-height:0}
.w-tl .tk>span{flex:0 0 58px;display:flex;align-items:center;padding-left:6px;opacity:.7;border-right:1px solid #ffffff14;white-space:nowrap;overflow:hidden}
.w-tl .ln{flex:1;position:relative}
.w-tl .cl{position:absolute;top:3px;bottom:3px;border-radius:4px;opacity:.85}
.w-tl .ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 4px #000}
.w-grid{position:absolute;inset:0;display:grid;gap:2px;padding:2px}
.w-grid .c{border-radius:3px;background:#ffffff12}
.w-grid .c.b{background:#ffffff22}
.w-grid .lb{font-size:10px;display:flex;align-items:center;color:var(--dim);overflow:hidden}
.w-led{position:absolute;inset:0;border-radius:50%}
.pop{position:absolute;z-index:99999;background:#232833;border:1px solid #3a4150;border-radius:10px;box-shadow:0 10px 30px #000a;overflow:hidden}
.pop div{padding:12px 14px;border-bottom:1px solid #ffffff10;font-size:16px;color:#e8eaf0}
.pop div.s{color:var(--acc);font-weight:600}
/* skins */
.sk-mx{box-shadow:inset 0 1px 0 #ffffff30,inset 0 -3px 0 #0007,0 2px 0 #000;text-transform:uppercase;letter-spacing:.8px;font-size:.85em}
.sk-mx .lamp{position:absolute;left:8px;top:8px;width:7px;height:7px;border-radius:50%}
.sk-st{text-transform:uppercase;letter-spacing:1.2px;box-shadow:inset 0 0 0 1px #ffffff22,inset 0 2px 8px #000}
.sk-st.on{box-shadow:inset 0 0 0 2px currentColor,inset 0 2px 8px #000}
.sk-lcd{box-shadow:inset 0 2px 12px #000,inset 0 0 0 1px #ffffff12}
.sk-lcd .cv span{font-family:Menlo,ui-monospace,monospace;font-weight:600;letter-spacing:2px}
.sk-lcd .pm{background:#ffffff08}
.sk-mxc{box-shadow:inset 0 2px 10px #000,0 0 0 3px #2b2e34,0 0 0 4px #000}
.w-slider .tk{position:absolute;left:0;right:0;top:50%;height:30px;margin-top:-15px;background:repeating-linear-gradient(90deg,#ffffff40 0 1px,transparent 1px 10%);opacity:.6;-webkit-mask:linear-gradient(#000 0 30%,transparent 30% 70%,#000 70%);mask:linear-gradient(#000 0 30%,transparent 30% 70%,#000 70%)}
.w-slider.v .tk{left:50%;right:auto;top:0;bottom:0;width:30px;height:auto;margin:0 0 0 -15px;background:repeating-linear-gradient(0deg,#ffffff40 0 1px,transparent 1px 10%);-webkit-mask:linear-gradient(90deg,#000 0 30%,transparent 30% 70%,#000 70%);mask:linear-gradient(90deg,#000 0 30%,transparent 30% 70%,#000 70%)}
.w-slider .th.fd{width:22px;height:40px;margin-top:-20px;border-radius:3px;background:linear-gradient(90deg,#8d9096,#e9eaec 40%,#3a3c40 47%,#3a3c40 53%,#e9eaec 60%,#8d9096);box-shadow:0 3px 6px #000c}
.w-slider.v .th.fd{width:40px;height:22px;margin:0 0 0 -20px;background:linear-gradient(180deg,#8d9096,#e9eaec 40%,#3a3c40 47%,#3a3c40 53%,#e9eaec 60%,#8d9096)}
.w-panel .sc{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d8d9db,#6d7076 60%,#2a2c30);box-shadow:0 1px 1px #000}
.w-meter .seg{position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 4px,#0b0d11 4px 6px)}
.w-meter.h .seg{background:repeating-linear-gradient(to right,transparent 0 4px,#0b0d11 4px 6px)}
.refimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:0}
.thc{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.thc.cur{border-color:var(--acc)}
.thc b{display:block;margin:8px 0 2px}
.thc small{color:var(--dim);display:block;line-height:1.35}
.tprev{position:relative;width:300px;height:120px;border-radius:10px;overflow:hidden;margin:0 auto;pointer-events:none}
.tprev .el{position:absolute}
.fld{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px;font-size:16px;font-family:inherit;margin:4px 0 10px}
/* synth */
.w-rock{position:absolute;inset:0;border-radius:2px;box-shadow:inset 0 0 0 1px #0005,0 2px 0 #000,0 3px 4px #0008;overflow:hidden}
.w-rock:after,.w-rockb:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#ffffff70 0,#ffffff10 46%,#00000030 54%,#00000070 100%)}
.w-rock.on:after,.w-rockb.on:after{background:linear-gradient(90deg,#00000070 0,#00000030 46%,#ffffff10 54%,#ffffff70 100%)}
.w-rockb{box-shadow:inset 0 0 0 1px #0005,0 2px 0 #000,0 3px 4px #0008;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.w-rockb span{position:relative;z-index:1}
/* importazione guidata */
#wiz{position:fixed;inset:0;z-index:150;background:#0b0d11;display:flex;flex-direction:column}
#wiz .wbar{display:flex;gap:8px;align-items:center;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--p1);border-bottom:1px solid var(--line);font-size:14px}
#wiz .wbar>div{flex:1;min-width:0}
#wiz .wbar small{color:var(--dim);font-size:12px;line-height:1.3;display:block}
#wiz .wfr{flex:1;position:relative;overflow:hidden;display:flex;justify-content:center}
#wiz iframe{border:0;background:#fff;transform-origin:0 0;position:absolute;top:0}
/* modal */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:100}
#modal.open{display:flex}
.mbox{background:var(--p1);width:100%;max-width:540px;max-height:88%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);border:1px solid var(--line)}
body.wide #modal{align-items:center}
body.wide .mbox{border-radius:16px}
.mh{padding:14px 16px 6px;font-weight:800;font-size:17px}
.mb{padding:4px 16px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px 14px;flex-wrap:wrap}
.mi{display:block;width:100%;text-align:left;padding:13px 14px;background:var(--p2);border:1px solid var(--line);border-radius:10px;margin:6px 0;color:var(--tx);font-size:16px}
.mi span{color:var(--acc);display:inline-block;width:26px}
.out,#impTxt{width:100%;height:220px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 Menlo,monospace}
.pj{display:flex;align-items:center;gap:8px;padding:10px;background:var(--p2);border:1px solid var(--line);border-radius:10px;margin:6px 0}
.pj div{flex:1;min-width:0}
.pj b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj small{color:var(--dim)}
.pj.cur{border-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a2f3a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;border:1px solid var(--line)}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">

function descEl(e){var p=[];
  if(e.text)p.push('testo "'+e.text+'"');
  if(e.icon)p.push('icona '+e.icon);
  if(LISTY[e.type])p.push('voci: '+opts(e).join(' / ')+' (iniziale: '+(opts(e)[e.value]||'')+')');
  else if(hasVal(e)&&e.type!=='timeline')p.push('valore '+e.value+' (da '+e.min+' a '+e.max+(e.step?', passo '+e.step:'')+')');
  if(hasOn(e))p.push(e.on?'acceso':'spento');
  if(e.type==='counter'&&e.pm)p.push('con tasti − e +');
  if(e.fmt==='time')p.push('mostrato come tempo m:ss');
  if(e.orient==='v')p.push('verticale');
  if(e.type==='grid')p.push(e.rows+' righe × '+e.cols+' passi');
  if(e.type==='timeline')p.push(e.tracks+' tracce ('+String(e.labels||'').split('\n').slice(0,+e.tracks||0).join(', ')+'), testina a '+(e.value||0)+' su '+(e.max==null?100:e.max));
  if(e.type==='image')p.push(e.src?'con foto':'segnaposto');
  if(e.skin)p.push('grafica '+({mixer:'mixer',strumento:'pannello strumenti',synth:'sintetizzatore vintage',legno:'legno'}[e.skin]||e.skin));
  if(+e.rot)p.push('ruotato di '+e.rot+'°');if(e.opacity!=null&&+e.opacity<100)p.push('opacità '+e.opacity+'%');if(e.font)p.push('carattere '+{r:'arrotondato',m:'monospazio',s:'serif',c:'condensato'}[e.font]);if(+e.bw>0)p.push('bordo '+e.bw+'px '+(e.bc||'#ffffff'));if(e.shadow)p.push('ombra '+{s:'leggera',m:'media',l:'forte',g:'bagliore'}[e.shadow]);
  if(e.bg)p.push('sfondo '+e.bg);if(e.accent)p.push('accento '+e.accent);
  return p.join(', ');}

  case 'reset':return 'riporta '+T+' al valore iniziale';case 'link':return 'copia il proprio valore su '+T+' (in proporzione)';case 'toggle':return 'accende/spegne '+T;
  case 'show':return 'mostra '+T;case 'hide':return 'nasconde '+T;case 'showhide':return 'mostra/nasconde '+T;

    [{l:'Chiudi'},{l:'Copia',c:'acc',fn:function(){var t=sendText(($('#sendNote').value||'').trim());$('#sendOut').value=t;copyText(t);return false}}]);

/* ---------- archivio condiviso con Claude (solo nella versione dentro Claude) ---------- */
function imgList(o){return o.elements||o.snap||[]}
function stripImgs(o){var c=clone(o);if(c.ref)c.ref='[foto]';imgList(c).forEach(function(e){if(e.src&&e.src.indexOf('data:')===0)e.src='[foto]'});return c}
function keepImgs(remote,local){if(!local)return remote;if(remote.ref==='[foto]')remote.ref=local.ref||'';var m={};imgList(local).forEach(function(e){if(e.src)m[e.id]=e.src});imgList(remote).forEach(function(e){if(e.src==='[foto]')e.src=m[e.id]||''});return remote}
function makeSync(col,o){var sent={},busy={},pend={},ready=false,S={};
  function prep(x){var j=JSON.stringify(x);if(j.length>230000)j=JSON.stringify(stripImgs(x));return j}
  function go(id){var x=pend[id];delete pend[id];if(!x)return;var j=prep(x);if(sent[id]===j)return;if(j.length>250000){toast('«'+(x.name||'')+'» è troppo grande per l\'archivio condiviso');return}
    busy[id]=true;DB.doc(col+'/'+id).set({json:j,name:x.name||'',ts:o.ts(x)||Date.now()}).then(function(){sent[id]=j;busy[id]=false;if(pend[id])go(id)},function(e){busy[id]=false;if(e&&e.code==='quota_exceeded')toast('Archivio condiviso pieno');})}
  S.push=function(x){if(!ready||!x||!x.id)return;pend[x.id]=x;if(!busy[x.id])go(x.id)};
  S.del=function(id){delete sent[id];DB.doc(col+'/'+id).delete().catch(function(){})};
  DB.collection(col).onSnapshot(function(snap){
    snap.docChanges().forEach(function(ch){var id=ch.doc.id;
      if(ch.type==='removed'){if(sent[id]!==undefined&&!snap.metadata.hasPendingWrites){delete sent[id];o.remove(id)}return}
      var d=ch.doc.data()||{},j=d.json;if(typeof j!=='string')return;var x;try{x=JSON.parse(j)}catch(e){return}if(!x||typeof x!=='object')return;x.id=id;
      sent[id]=j;var loc=o.get(id);if(!loc||(o.ts(x)||0)>(o.ts(loc)||0))o.put(keepImgs(x,loc),!!loc)});
    if(!ready&&!snap.metadata.fromCache){ready=true;o.all().forEach(function(x){var r=sent[x.id];if(r===undefined)S.push(x);else{try{if((o.ts(x)||0)>(o.ts(JSON.parse(r))||0))S.push(x)}catch(e){}}});setCloud(true)}
  },function(){setCloud(false)});
  return S}
var DB=null,cloudOn=false;
function setCloud(on){cloudOn=on;updUI()}
function initShared(){if(!window.claude||typeof window.claude.use!=='function')return;
  window.claude.use('db').then(function(db){if(!db)return;DB=db;
    SYNC.p=makeSync('progetti',{ts:function(x){return x.updated},get:function(id){return store.projects[id]},all:function(){return Object.keys(store.projects).map(function(k){return store.projects[k]})},
      put:function(x,existed){store.projects[x.id]=x;saveLocal();
        if(P&&P.id===x.id){if(JSON.stringify(P)!==JSON.stringify(x)){if(mode==='play')setMode('edit');P=x;lastSavedJson=JSON.stringify(P);hist=hist.slice(0,hi+1);hist.push(lastSavedJson);hi=hist.length-1;if(!getSel())selId=null;applyZoom();renderPalette();renderStage();renderProps();updUI();toast('Progetto aggiornato da Claude (↶ per annullare)')}}
        else if(!existed)toast('Nuovo progetto nell\'archivio: «'+x.name+'» (Menu › Progetti recenti)')},
      remove:function(id){if(P&&id===P.id)return;delete store.projects[id];saveLocal()}});
    SYNC.t=makeSync('modelli',{ts:function(x){return x.saved||1},get:function(id){return themeById(id)&&id.charAt(0)==='u'?themeById(id):null},all:function(){return userThemes},
      put:function(x,existed){if(x.id.charAt(0)!=='u')return;var f=false;for(var i=0;i<userThemes.length;i++)if(userThemes[i].id===x.id){userThemes[i]=x;f=true}if(!f)userThemes.push(x);try{localStorage.setItem(TKEY,JSON.stringify(userThemes))}catch(e){}renderPalette();if(!existed)toast('Nuovo modello nell\'archivio: «'+x.name+'»')},
      remove:function(id){userThemes=userThemes.filter(function(t){return t.id!==id});try{localStorage.setItem(TKEY,JSON.stringify(userThemes))}catch(e){}}});
  }).catch(function(){});
  window.claude.use('sample').then(function(sm){if(sm){SAMPLE=sm;$('#askB').style.display=''}}).catch(function(){});
}

/* ---------- Chiedi a Claude ---------- */
var SAMPLE=null,askHist=[],askImg=null,askBusy=false;
function catalog(){var t='';for(var k in TYPES)t+='- '+k+' ('+TYPES[k].label+'): campi '+TYPES[k].f.join(', ')+'; misura tipica '+TYPES[k].w+'×'+TYPES[k].h+'\n';return t}
function askPrompt(req){var d=dev(),cp=stripImgs(P);delete cp.updated;
  return 'Sei l\'assistente grafico dentro ARNODESIGN, un editor di interfacce. Rispondi SOLO con un oggetto JSON valido, senza testo fuori dal JSON.\n'+
  'Formato della risposta: {"risposta":"spiegazione breve in italiano di cosa hai fatto","progetto":<il progetto COMPLETO aggiornato, oppure null se non va cambiato>,"modello":<un modello grafico nuovo, oppure null>}\n\n'+
  'REGOLE DEL PROGETTO\n- Dispositivo '+d.n+': '+d.w+'×'+d.h+' punti; coordinate x,y,w,h in punti, origine in alto a sinistra. Tieni gli elementi dentro lo schermo'+(d.safeT?', sotto y='+d.safeT:'')+(d.safeB?' e sopra y='+(d.h-d.safeB):'')+'.\n'+
  '- Ogni elemento: {id, type, name, x, y, w, h, visible, locked, rot (gradi), actions:[...], più i campi di stile/valore del suo tipo}. Mantieni gli id esistenti; i nuovi elementi hanno un id nuovo unico (lettere e numeri). L\'ordine dell\'array è l\'ordine dei livelli (ultimo = davanti).\n'+
  '- Tipi e campi:\n'+catalog()+
  '- Campi di stile comuni: color, bg, accent, border (colori #rrggbb oppure "" per nessuno), radius, fs (dimensione testo), font ("", "g" geometrico, "r" arrotondato, "m" monospazio, "s" serif, "c" condensato), shadow ("", "s","m","l","g" bagliore), bw/bc (bordo), opacity (0-100), skin (grafica: "", "mixer", "strumento", "synth", "legno" solo pannelli), icon (per i pulsanti, es. ▶ ■ ● ⏸ ⏮ ⏭).\n'+
  '- actions: [{on:"tap"|"change", do:"inc"|"dec"|"set"|"reset"|"link"|"toggle"|"show"|"hide"|"showhide"|"timer", target:<id>, amount, ms, bpmFrom:<id>}]. Non cambiare le funzioni se non è richiesto.\n'+
  '- Cambia solo ciò che la richiesta chiede; lascia invariato il resto. Le immagini "[foto]" lasciale come sono.\n\n'+
  'MODELLO GRAFICO (solo se richiesto, per esempio da una foto): {"name":"...","note":"descrizione dello stile","bg":"#rrggbb","types":{"<tipo>":{campi di stile}}}.\n\n'+
  'PROGETTO ATTUALE:\n'+JSON.stringify(cp)+'\n\n'+(askHist.length?'RICHIESTE PRECEDENTI IN QUESTA SESSIONE:\n'+askHist.slice(-4).map(function(h){return '- '+h}).join('\n')+'\n\n':'')+
  (askImg?'È allegata una foto di riferimento.\n':'')+'RICHIESTA:\n'+req}
function parseJ(t){if(typeof t==='object')return t;var s0=t.indexOf('{'),e0=t.lastIndexOf('}');return JSON.parse(t.slice(s0,e0+1))}
function showAsk(){
  var b=modal('Chiedi a Claude','<p class="hint">Descrivi cosa cambiare nel progetto aperto: «sposta i pulsanti in basso e falli più grandi», «applica uno stile mixer ai comandi», «aggiungi un contatore BPM sopra il cursore»… Puoi allegare una foto, per esempio per creare un modello grafico. Ogni modifica si annulla con ↶.</p><textarea class="fld" id="askTxt" rows="4" placeholder="Scrivi qui la richiesta…"></textarea><div class="brow"><label class="btn small">📷 Allega foto<input type="file" accept="image/*" id="askFile" style="display:none"></label><span class="hint" id="askImgLbl">'+(askImg?'foto allegata ✓':'')+'</span></div><div id="askOut" class="hint" style="white-space:pre-wrap;margin-top:8px"></div>',
    [{l:'Chiudi'},{l:'Invia',c:'acc',fn:function(){sendAsk();return false}}]);
  b.querySelector('#askFile').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var M=1200,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(bl){askImg=bl;$('#askImgLbl').textContent='foto allegata ✓'},'image/jpeg',.85)};im.src=fr.result};fr.readAsDataURL(f)};
}
function sendAsk(){if(askBusy||!SAMPLE)return;var req=($('#askTxt').value||'').trim();if(!req){toast('Scrivi prima la richiesta');return}
  askBusy=true;var out=$('#askOut');out.textContent='Claude sta lavorando…';
  var opts={modelTier:'complex'};if(askImg)opts.images=[askImg];
  var ask=SAMPLE.json?SAMPLE.json(askPrompt(req),opts):SAMPLE(askPrompt(req),opts).then(function(r){return r.text});
  Promise.resolve(ask).then(function(res){askBusy=false;var o;try{o=parseJ(res)}catch(e){out.textContent='Non ho capito la risposta di Claude: riprova con parole diverse.';return}
    var msg=[];askHist.push(req);
    if(o.progetto&&Array.isArray(o.progetto.elements)){var np=o.progetto,ids={};
      np.elements=np.elements.filter(function(e){return e&&TYPES[e.type]}).map(function(e){var base=mk(e.type,{});for(var k in e)base[k]=e[k];if(!base.id||ids[base.id])base.id=uid();ids[base.id]=1;['x','y','w','h'].forEach(function(k){base[k]=Math.round(+base[k]||0)});base.w=Math.max(2,base.w);base.h=Math.max(2,base.h);if(!Array.isArray(base.actions))base.actions=[];return base});
      if(mode==='play')setMode('edit');var keepId=P.id,keepTheme=P.theme;P=keepImgs(np,P);P.id=keepId;if(!P.theme)P.theme=keepTheme;if(!DEVICES[P.device])P.device='iphone15';if(!P.bg)P.bg='#0f1115';if(P.grid==null)P.grid=8;if(P.guides==null)P.guides=true;
      if(!getSel())selId=null;snapshot();applyZoom();renderPalette();renderStage();renderProps();updUI();msg.push('✓ Modifiche applicate al progetto (↶ per annullare).')}
    if(o.modello&&typeof o.modello.types==='object'){var m=o.modello,nt={id:'u'+uid(),name:m.name||'Modello di Claude',note:m.note||'',bg:m.bg||'#0f1115',types:{},saved:Date.now()};
      for(var k in m.types)if(TYPES[k]){nt.types[k]={};for(var k2 in m.types[k])if(THEMEK.indexOf(k2)>=0)nt.types[k][k2]=m.types[k][k2]}
      userThemes.push(nt);saveThemes();renderPalette();msg.push('✓ Modello «'+nt.name+'» aggiunto all\'archivio (☰ › Modelli grafici).')}
    out.textContent=(o.risposta||'')+(msg.length?'\n\n'+msg.join('\n'):'');askImg=null;var l=$('#askImgLbl');if(l)l.textContent='';
  },function(e){askBusy=false;out.textContent=e&&e.code==='rate_limited'?'Troppe richieste ravvicinate: aspetta un momento e riprova.':(e&&e.code==='not_granted'?'Permesso negato: Claude non può essere usato da questa pagina.':'Errore: '+((e&&e.message)||'richiesta non riuscita'))});
}

var toastT;function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show')},2600)}

/* ---------- keyboard (Mac) ---------- */
document.addEventListener('keydown',function(ev){
  var tg=ev.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if($('#modal').classList.contains('open')){if(ev.key==='Escape')closeModal();return}
  var mod=ev.metaKey||ev.ctrlKey;
  if(mod&&ev.key.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return}
  if(mode==='play'){if(ev.key==='Escape')setMode('edit');return}
  var e=getSel();
  if(ev.key==='Escape'){select(null);return}
  if(!e)return;
  if(ev.key==='Backspace'||ev.key==='Delete'){ev.preventDefault();delSel();return}
  if(mod&&ev.key.toLowerCase()==='d'){ev.preventDefault();$('#fDup').onclick();return}
  var st=ev.shiftKey?(+P.grid||10):1,mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[ev.key];
  if(mv&&!e.locked){ev.preventDefault();e.x+=mv[0];e.y+=mv[1];renderStage();updGeo();clearTimeout(window._nT);window._nT=setTimeout(snapshot,300)}
});
document.addEventListener('gesturestart',function(e){e.preventDefault()});

/* ---------- layout ---------- */
var mq=window.matchMedia('(min-width: 900px)');
function onMQ(){document.body.classList.toggle('wide',mq.matches);if(mq.matches)closeSheets();renderProps();setTimeout(applyZoom,0)}
if(mq.addEventListener)mq.addEventListener('change',onMQ);else mq.addListener(onMQ);
if(window.ResizeObserver)new ResizeObserver(function(){if(zoomFit)applyZoom()}).observe(scroller);else window.addEventListener('resize',function(){if(zoomFit)applyZoom()});

/* ---------- start ---------- */
store=loadStore()||{projects:{},current:null};
P=(store.current&&store.projects[store.current])||null;
if(!P){P=demo();store.projects[P.id]=P;setTimeout(function(){toast('Ecco un esempio: premi ▶ Prova, poi ＋ per aggiungere elementi')},600)}
renderPalette();hist=[JSON.stringify(P)];hi=0;
document.body.classList.toggle('wide',mq.matches);
lastSavedJson=JSON.stringify(P);fitMode=+P.pageH>0?'width':'all';applyZoom();renderStage();renderProps();updUI();saveNow();
initShared();
/* progetti preparati da Claude (file pronti.json pubblicato accanto alla pagina) */
try{fetch('pronti.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).then(function(d){if(!d||!Array.isArray(d.projects))return;var seen={};try{seen=JSON.parse(localStorage.getItem('arnodesign.pronti'))||{}}catch(e){}
  var added=[];d.projects.forEach(function(p){if(!p||!p.id||!Array.isArray(p.elements)||seen[p.id+'@'+(p.updated||0)])return;seen[p.id+'@'+(p.updated||0)]=1;var loc=store.projects[p.id];if(loc&&(loc.updated||0)>=(p.updated||0))return;store.projects[p.id]=p;added.push(p);if(SYNC.p)SYNC.p.push(p)});
  try{localStorage.setItem('arnodesign.pronti',JSON.stringify(seen))}catch(e){}
  if(added.length){saveLocal();modal('Progetti preparati da Claude',added.map(function(p){return '<div class="pj"><div><b>'+esc(p.name)+'</b><small>'+p.elements.length+' elementi</small></div><button class="btn small acc" data-pj="open" data-id="'+p.id+'">Apri</button></div>'}).join('')+'<p class="hint">Li trovi anche in ☰ › Progetti recenti.</p>')}
}).catch(function(){})}catch(e){}
})();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
