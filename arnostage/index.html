<style>
:root{--bg:#000;--fg:#f5f5f3;--mut:#9a9a94;--card:#161616;--card2:#202022;--line:#2e2e2c;--acc:#6b9bff;--ok:#22c55e;--warn:#f59e0b;--del:#ef4444;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="gray"]{--bg:#525256;--card:#3f3f44;--card2:#48484d;--line:#68686e;--mut:#d4d4d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*:not(input):not(select):not(textarea){-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);position:relative;z-index:30;flex:none}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:17px;margin-right:6px}
.brand i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#1d4ed8);display:inline-flex;align-items:center;justify-content:center}
.brand span{color:var(--acc)}
.mbtn{background:none;border:0;color:var(--fg);font:inherit;font-size:14px;padding:6px 8px;border-radius:7px}
.mbtn.open{background:var(--card2)}
.menu{position:absolute;top:100%;min-width:230px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:none}
.menu.open{display:block}
.menu button,.menu label{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:9px 10px;border-radius:7px}
.menu button:active,.menu label:active{background:var(--acc)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu .chk::after{content:"";}
.menu .chk.on::after{content:"✓";color:var(--acc)}
#hdmi{margin-left:auto;font-size:12px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mut)}
#hdmi{background:none;font:inherit;font-size:12px}
#hdmi.on{color:#fff;background:var(--ok);border-color:var(--ok)}
#hdmi.off{color:var(--warn);border-color:var(--warn)}
main{flex:1;min-height:0;display:flex;position:relative}
#colL,#colR{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 8px 20px}
#tabs{display:flex;flex:none;border-top:1px solid var(--line);background:var(--bg)}
#tabs button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:14px;padding:9px 4px 8px}
#tabs button.on{color:var(--acc);font-weight:700}
#tabs .tp{flex:none;width:64px;margin:4px 0;border-radius:10px;background:var(--acc);color:#fff;font-size:18px}
#tabs .tp.on{background:var(--ok)}
body:not(.wide) main #colR{display:none}
body:not(.wide).pgList main #colL{display:none}
body:not(.wide).pgList main #colR{display:block}
body.wide:not(.pgProj) #tbList{display:none}
body.wide #tabs button{padding:5px 4px 4px}
body.wide #tabs .tp{margin:3px 0}
body.pgMix #colL>*:not(#mixSec){display:none!important}
body.pgMix main #colR{display:none!important}
#colP{display:none}
body.pgProj main #colL,body.pgProj main #colR{display:none!important}
body.pgProj main #colP{display:block;flex:1}
#tabs button{font-size:13px}
.job{padding:4px 2px}.job b{font-size:15px}.job .bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.job .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#22c55e);transition:width .15s}
.job .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;gap:8px}
.job.err b{color:var(--del)}.job.ok b{color:var(--ok)}
.pj{border-top:1px solid var(--line);padding:8px 2px}.pj:first-child{border-top:0}
.pj .h{display:flex;align-items:center;gap:6px}.pj .h span{flex:1;min-width:0}.pj .h small{color:var(--mut)}
.pj .h button{background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:8px;height:32px;min-width:34px;font-size:13px;padding:0 8px}
.pj .h .acc{background:var(--acc);border-color:var(--acc);color:#fff}
.pj ol{margin:6px 0 2px 4px;padding-left:22px;font-size:13px;color:var(--mut)}.pj ol li{padding:1px 0}
.pj .h small.open{color:var(--ok);font-weight:700}
.pj.curp{background:color-mix(in srgb,var(--acc) 10%,transparent);border-radius:8px}
.expo label{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px;margin:6px 0}
.expo label input{margin-top:3px;width:20px;height:20px}.expo small{color:var(--mut)}
.warnx{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.warnx.bad{border-color:var(--del);background:color-mix(in srgb,var(--del) 14%,transparent)}
body.pgMix main #colL{display:flex!important}
body.pgMix #mixSec{min-height:0}
body.wide #colR{flex:0 0 min(42%,420px);border-left:1px solid var(--line)}
#stage{position:relative;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:16/9;width:var(--vw,100%);margin:0 auto;display:flex;align-items:center;justify-content:center}
#grip{height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ns-resize;margin-bottom:4px}
#grip i{width:48px;height:5px;border-radius:3px;background:var(--line)}
#novid{display:none;align-items:center;gap:12px;margin:0 0 8px}
#novid .bars{width:33.33%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex:none;border:1px solid var(--line)}
#novid span{color:var(--mut);font-size:14px}
body.novid #stage,body.novid #grip{display:none}
body.novid #novid{display:flex}
#stage video{width:100%;height:100%;object-fit:contain;background:#000}
#stage .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;text-align:center;padding:10px}
#songT{font-weight:700;font-size:18px;text-align:center;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#songT small{color:var(--mut);font-weight:400;font-size:13px}
.trow{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:28px;margin:0;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--fg);margin-top:-8.5px;border:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#seek::-webkit-slider-thumb{background:var(--acc)}
.transport{display:flex;justify-content:center;gap:12px;margin:4px 0 10px}
.tb{width:56px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;display:flex;align-items:center;justify-content:center}
.tb.play{width:84px;background:var(--acc);border-color:var(--acc);color:#fff;font-size:24px}
.tb.play.on{background:var(--ok);border-color:var(--ok)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.sech{display:flex;align-items:center;gap:6px;margin:0 2px 6px;font-weight:700;font-size:14px}
.sech .sp{flex:1}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.strip{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 4px;border-top:1px solid var(--line)}
.strip:first-of-type{border-top:0}
.strip .nm{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px}
.strip .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .nm .db{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.strip .tg{display:flex;gap:4px;align-items:center}
.tg button,.tg select{font:inherit;font-size:12px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--fg);padding:0 7px}
.tg .m.on{background:var(--del);border-color:var(--del);color:#fff}
.tg .s.on{background:var(--warn);border-color:var(--warn);color:#000}
.tg .x{color:var(--mut)}
.strip .fr{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.strip .fr .pan{width:76px;flex:none}
.meter{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter.mst{height:6px;border-radius:3px;margin-top:1px}
.panc{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-size:11px;padding:0}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok) 0 70%,var(--warn) 70% 88%,var(--del) 88%);transition:width .06s linear}
.strip{border-radius:9px;margin-top:3px;position:relative}
.clkl{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;letter-spacing:.12em;color:#fff;line-height:1}
.led{display:inline-block;width:16px;height:16px;border-radius:50%;background:#4a0d0d;border:1px solid #2a0505;flex:none;transition:background .06s,box-shadow .06s}
.led.on{background:#ff2a2a;box-shadow:0 0 10px 3px rgba(255,40,40,.8)}
#ledT{width:12px;height:12px;margin:0 6px;display:none}
body.hasclk #ledT{display:inline-block}
.ord{display:none;gap:4px;position:absolute;right:6px;top:6px;z-index:2}
#mix.ordering .ord{display:flex}
#mix.ordering .strip,#mix.ordering .vrow{padding-right:76px}
.ord button{width:32px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--fg)}
.vrow{position:relative;border-radius:9px}
.strip .ico{font-size:17px;flex:none}
.strip .nm b{cursor:pointer}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.pal button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.pal button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.icos{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.icos button{background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--fg);font-size:24px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.icos button small{font-size:10px;color:var(--mut)}
.icos button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 25%,var(--card))}
.lbl{font-size:12px;color:var(--mut)}
.vrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;padding:6px 4px;border-top:1px solid var(--line)}
.vrow b{flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.vrow input[type=number]{width:72px;font:inherit;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:4px 6px}
#list .it{display:flex;align-items:center;gap:6px;padding:8px 6px;border-radius:9px;border:1px solid transparent}
#list .it.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
#list .it .n{width:24px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
#list .it .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .it .t small{color:var(--mut)}
#list .it button{background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:7px;height:30px;min-width:30px;font-size:13px}
#list.noedit .it .ed{display:none}
.empty{color:var(--mut);font-size:13px;padding:10px;text-align:center}
#status{flex:none;font-size:12px;color:var(--mut);padding:5px 10px;border-top:1px solid var(--line);min-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.err{color:var(--del)}
#prog{position:fixed;left:0;right:0;top:0;height:3px;background:var(--acc);transform-origin:left;transform:scaleX(0);z-index:50;transition:transform .1s}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:60}
#sheet.on{display:flex}
#sheet.lk{background:rgba(0,0,0,.15)}#sheet.lk .box{max-height:52vh}
body.lkopen main{padding-bottom:52vh}
body.lkopen #colL>*:not(#mixSec){display:none!important}
body.lkopen main #colR{display:none!important}
body.lkopen main #colL{display:flex!important}
body.lkopen #mixSec{min-height:0}
body.lkopen #tabs{display:none}
#mix .strip.editing{zoom:calc(var(--mz,1)*1.3);outline:3px solid var(--acc);outline-offset:-2px}
#mix .strip.dragging{opacity:.85;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.7);outline:2px solid var(--acc)}
#mix.dragmode{scroll-snap-type:none}
@media (max-width:600px){.strip{grid-template-columns:1fr}.strip .tg{justify-content:flex-start}}
#sheet .box{background:var(--card2);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:80vh;overflow:auto;padding:12px 14px calc(14px + var(--sab))}
#sheet h3{margin:2px 0 10px;font-size:16px}
#sheet p{font-size:13px;color:var(--mut);margin:6px 0}
.frm{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:14px}
.frm select,.frm input{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px}

#mixSec{flex:1;min-height:170px;display:flex;flex-direction:column;margin-bottom:0}
#mix{flex:1;min-height:0;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding-bottom:2px}

#colL,#mixSec{min-width:0;max-width:100%}
/* ===== Mixer stile ARNOCLICK: telaio scuro, fader argentati con scala, display ambra ===== */
body.mixac #mix .strip{background:linear-gradient(180deg,#2b2e33,#1e2024);border:1px solid #33373e;border-bottom-color:#121316;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.5)}

body.mixac #mix .tg button,body.mixac #mix .panc,body.mixac #mix .ord button,body.mixac #mix .vstrip .tg button{background:linear-gradient(180deg,#3a3e45,#24272b);border:1px solid #4b5058;border-bottom:3px solid #121316;color:#eceef0;font-weight:700}

body.mixac #mix select{background:#1b1d21;border-color:#3a404b}

<script>
"use strict";
const $=id=>document.getElementById(id);
const VERSION='0.2.5';
// ===== Motore nativo (app) o Web Audio (browser) =====
const MH=(window.webkit&&window.webkit.messageHandlers)||{};
const NE=MH.eng||null, NS=MH.store||null, NM=MH.mon||null;
const NATIVE=!!NE;
const eng=o=>NE.postMessage(o);
function mon(o){if(!NATIVE&&cfg.hdmi===false&&o.t!=='black')return;if(NM)try{NM.postMessage(JSON.stringify(o));}catch(e){}}

let lib=[],sets=[],curSet=null,songs=[],cur=-1,playing=false,pos=0,dur=0,hdmiOn=false,outs=2,ins=0,cardName='',busy=false;
let cfg={auto:false,prev:true,gray:false,master:0,inOn:false,inA:0,inB:1,inDb:0,inOut:'s0',inMute:false};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('arnostage.cfg')||'{}'));}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('arnostage.cfg',JSON.stringify(cfg));}catch(e){}};
const uid=()=>'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dbg=db=>db<=-60?0:Math.pow(10,db/20);
const fmt=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;};
const fmtL=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2);};
const COLS=['','#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#8b5cf6','#ec4899','#a3a3a3'];
const ICONS=[['🎤','Voce'],['🎙️','Microfono'],['🎸','Chitarra'],['🎸','Basso'],['🎹','Tastiera'],['🥁','Batteria'],['🪘','Percussioni'],['🪇','Maracas'],['🎷','Sax'],['🎺','Tromba'],['🎻','Violino'],['🪕','Banjo'],['🪗','Fisarmonica'],['🪈','Flauto'],['🎼','Base'],['🎵','Musica'],['♩','Click'],['🎧','Cuffie'],['🔊','Uscita'],['🎛️','Mixer']];
const stripBg=(c,i)=>c?`background:color-mix(in srgb,${c} ${i==null?35:i}%,var(--card))`:'';
let looks={};
const lkey=t=>t.vid?'#video':(t.click||(t.click==null&&isClick(t.name)))?'#click':'#base';
const L=t=>{const g=looks[lkey(t)]||{};return {col:t.col!=null?t.col:(g.col||''),int:t.int!=null?t.int:(g.int==null?35:g.int),ico:t.ico||g.ico||(t.vid?'🎬':defIco(t.name)),lab:t.lab||g.lab};};
const defIco=n=>isClick(n)?'♩':'🎼';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function status(s,err){const e=$('status');e.textContent=s;e.classList.toggle('err',!!err);}
function prog(f){$('prog').style.transform='scaleX('+(f==null?0:Math.max(0,Math.min(1,f)))+')';}
const isClick=n=>/click|clic|metronom/i.test(n);
const AUD=/\.(wav|wave|aif|aiff|mp3|m4a|aac|caf|flac)$/i, VID=/\.(mp4|mov|m4v)$/i;

// ===== Archivio file (IndexedDB) =====
let db=null;
function idb(){return db?Promise.resolve(db):new Promise((res,rej)=>{const r=indexedDB.open('arnostage',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('files',{keyPath:'id'});r.result.createObjectStore('kv');};
  r.onsuccess=()=>{db=r.result;res(db);};r.onerror=()=>rej(r.error);});}
async function tx(st,mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(st,mode),s=t.objectStore(st);const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});}
const fPut=(id,name,blob)=>tx('files','readwrite',s=>s.put({id,name,type:blob.type||'',blob}));
const fGet=id=>tx('files','readonly',s=>s.get(id));
const fDel=id=>tx('files','readwrite',s=>s.delete(id));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
let saveT=0;function saveSongs(){clearTimeout(saveT);saveT=setTimeout(()=>{kvSet('lib',lib).catch(()=>{});kvSet('sets',sets).catch(()=>{});kvSet('curSet',curSet).catch(()=>{});kvSet('looks',looks).catch(()=>{});},250);}
// ===== Raccolta brani e scalette =====
// Un brano ha solo: Base (audio), Click, Video e Audio del video. Le altre strisce del mixer sono gli ingressi della scheda.
function normSong(s){const T=s.tracks||[];const v=T.find(t=>t.vid),c=T.find(t=>!t.vid&&(t.click!=null?t.click:isClick(t.name))),b=T.find(t=>t!==v&&t!==c);
  if(b){b.click=false;b.vid=false;if(!b.name||b.name==='Audio del video')b.name='Base';}
  if(c){c.click=true;c.vid=false;}
  s.tracks=[b,c,v].filter(Boolean);return s;}
function curSetObj(){let x=sets.find(y=>y.id===curSet);if(!x){if(!sets.length)sets.push({id:uid(),title:(LANG==='en'?'Setlist 1':'Scaletta 1'),items:[]});x=sets[0];curSet=x.id;}return x;}
function rebuild(){const m={};lib.forEach(x=>m[x.id]=x);const st=curSetObj();st.items=st.items.filter(id=>m[id]);songs=st.items.map(id=>m[id]);}
function projData(p){p=p||{};if(p.lib)return {lib:p.lib,sets:p.sets&&p.sets.length?p.sets:[{id:uid(),title:(LANG==='en'?'Setlist 1':'Scaletta 1'),items:p.lib.map(x=>x.id)}],curSet:p.curSet,looks:p.looks||{}};
  const L=(p.songs||[]).map(x=>Object.assign({},x,{id:x.id||uid()}));return {lib:L,sets:[{id:uid(),title:(LANG==='en'?'Setlist 1':'Scaletta 1'),items:L.map(x=>x.id)}],curSet:null,looks:p.looks||{}};}
function setProject(d){lib=d.lib||[];lib.forEach(normSong);sets=d.sets||[];curSet=d.curSet||null;looks=d.looks||{};cur=-1;rebuild();}
async function addFile(name,blob){const id=uid();await fPut(id,name,blob);return id;}

// ===== Attività (importazione / esportazione) con barra di avanzamento =====
const JOB={};
const mb=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':(b/1048576).toFixed(1)+' MB';
function jobStart(title){Object.assign(JOB,{on:true,title,pct:0,phase:'',detail:'',t0:Date.now(),res:null,err:false});page('proj');renderJob();}
function jobSet(pct,phase,detail){if(!JOB.on)return;JOB.pct=Math.max(0,Math.min(1,pct));if(phase!=null)JOB.phase=phase;if(detail!=null)JOB.detail=detail;prog(JOB.pct);renderJobSoon();}
function jobEnd(res,err){JOB.on=false;JOB.res=res;JOB.err=!!err;JOB.pct=err?JOB.pct:1;prog(null);renderJob();status(res,err);if(!err)renderProj();}
let rjT=0;function renderJobSoon(){if(!rjT)rjT=setTimeout(()=>{rjT=0;renderJob();},100);}
function renderJob(){const b=$('jobBox');if(!JOB.title){b.innerHTML='<div class="empty">Nessuna importazione o esportazione in corso.</div>';return;}
  const el=(Date.now()-JOB.t0)/1000,left=JOB.on&&JOB.pct>0.03?el*(1-JOB.pct)/JOB.pct:null;
  b.innerHTML=`<div class="job${JOB.on?'':JOB.err?' err':' ok'}"><b>${JOB.on?'⏳ ':JOB.err?'⚠️ ':'✅ '}${esc(JOB.title)}</b>
   <div class="bar"><i style="width:${(JOB.pct*100).toFixed(1)}%"></i></div>
   <div class="row"><span>${esc(JOB.on?JOB.phase:JOB.res||'')}</span><span>${(JOB.pct*100).toFixed(0)}%</span></div>
   <div class="row"><span>${esc(JOB.on?JOB.detail:'')}</span><span>${JOB.on?fmt(el)+(left!=null?' · mancano ~'+fmt(left):''):'durata '+fmt(el)}</span></div></div>`;}
window.zipProg=(d,t,f)=>jobSet(0.35+0.65*(t?d/t:0),'Creo lo .zip',f+' · '+mb(d/2)+(LANG==='en'?' of ':' di ')+mb(t/2));

// ===== Copia dei file nell'app (per il motore nativo e il monitor) =====
const b64Of=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result);res(s.slice(s.indexOf(',')+1));};r.onerror=rej;r.readAsDataURL(blob);});
const extOf=n=>{const m=String(n).match(/\.([A-Za-z0-9]{2,5})$/);return m?m[1].toLowerCase():'bin';};
async function ensureNative(ids,label,cb){
  if(!NS||!ids.length)return;
  const have=await NS.postMessage({op:'has',ids})||[];
  const miss=ids.filter(i=>have.indexOf(i)<0);const fs=[];let tot=0,done=0;
  for(const id of miss){const f=await fGet(id);if(f){fs.push(f);tot+=f.blob.size;}}
  for(const f of fs){const CH=1536*1024,n=Math.max(1,Math.ceil(f.blob.size/CH));
    for(let k=0;k<n;k++){const sl=f.blob.slice(k*CH,(k+1)*CH),b=await b64Of(sl);
      await NS.postMessage({op:'put',id:f.id,ext:extOf(f.name),seq:k,last:k===n-1,b64:b});done+=sl.size;
      if(cb)cb(tot?done/tot:1,f.name,done,tot);else{prog(tot?done/tot:1);status('Copio nell\'app: '+f.name+' '+Math.round((k+1)/n*100)+'%');}}
  }
  prog(null);
}

// ===== Motore Web Audio (solo per provare nel browser: tutto sulle uscite 1-2) =====
const WA={ctx:null,bufs:{},nodes:[],t0:0,from:0,mg:null};
function waCtx(){if(!WA.ctx){setTimeout(sendMono,0);WA.ctx=new (window.AudioContext||window.webkitAudioContext)();WA.mg=WA.ctx.createGain();WA.mg.connect(WA.ctx.destination);const sp=WA.ctx.createChannelSplitter(2);WA.mg.connect(sp);WA.aL=WA.ctx.createAnalyser();WA.aR=WA.ctx.createAnalyser();WA.aL.fftSize=WA.aR.fftSize=512;sp.connect(WA.aL,0);sp.connect(WA.aR,1);WA.dL=new Float32Array(512);}return WA.ctx;}
async function waLoad(id){if(WA.bufs[id])return WA.bufs[id];const f=await fGet(id);if(!f)throw 0;
  const ab=await f.blob.arrayBuffer();const b=await new Promise((res,rej)=>waCtx().decodeAudioData(ab,res,rej));WA.bufs[id]=b;return b;}
function waStop(){WA.nodes.forEach(n=>{try{n.src.stop();}catch(e){}n.src.disconnect();});WA.nodes=[];}
function waPlay(from){lastCk=from;const c=waCtx();if(c.state!=='running')c.resume();waStop();
  const s=songs[cur];if(!s)return;WA.from=from;WA.t0=c.currentTime+0.05;
  s.tracks.forEach((t,i)=>{const b=WA.bufs[t.fid];if(!b)return;const src=c.createBufferSource();src.buffer=b;
    const g=c.createGain(),p=c.createStereoPanner?c.createStereoPanner():null,an=c.createAnalyser();an.fftSize=512;
    src.connect(g);if(p){g.connect(p);p.connect(an);}else g.connect(an);an.connect(WA.mg);
    const off=vOff(s,t);if(from<off)src.start(WA.t0+(off-from),0);else if(from-off<b.duration)src.start(WA.t0,from-off);WA.nodes[i]={src,g,p,an,data:new Float32Array(512)};});
  waMix();}
function waPos(){return WA.ctx?Math.max(WA.from,WA.from+WA.ctx.currentTime-WA.t0):0;}
function waMix(){const s=songs[cur];if(!s||!WA.mg)return;WA.mg.gain.value=dbg(cfg.master);
  s.tracks.forEach((t,i)=>{const n=WA.nodes[i];if(!n)return;n.g.gain.value=effGain(s,t);if(n.p)n.p.pan.value=t.pan||0;});}
function waMaster(){if(!WA.aL)return[0,0];const pk=a=>{a.getFloatTimeDomainData(WA.dL);let m=0;for(const v of WA.dL){const x=Math.abs(v);if(x>m)m=x;}return m;};return[pk(WA.aL),pk(WA.aR)];}
function waPeaks(){return WA.nodes.map(n=>{if(!n)return 0;n.an.getFloatTimeDomainData(n.data);let m=0;for(const v of n.data){const a=Math.abs(v);if(a>m)m=a;}return m;});}

// ===== Mixer =====
function sendMono(){if(NATIVE)eng({op:'mono',on:!!cfg.mono});else if(WA.ctx){const d=WA.ctx.destination;try{d.channelCount=cfg.mono?1:2;d.channelCountMode='explicit';d.channelInterpretation='speakers';}catch(e){}}}
const anySolo=s=>s.tracks.some(t=>t.solo);
const effGain=(s,t)=>(t.mute||(anySolo(s)&&!t.solo))?0:dbg(t.db);
function outVal(o){const m=/^([sm])(\d+)$/.exec(o||'s0')||['','s','0'];return {out:+m[2],om:m[1]==='m'?'mono':'st'};}
function outOptions(sel,withMono=true){let h='';
  for(let c=0;c+1<outs;c+=2)h+=`<option value="s${c}"${sel==='s'+c?' selected':''}>Out ${c+1}-${c+2}</option>`;
  if(withMono)for(let c=0;c<outs;c++)h+=`<option value="m${c}"${sel==='m'+c?' selected':''}>Out ${c+1} mono</option>`;
  if(!/^[sm]\d+$/.test(sel||'')||+(sel||'s0').slice(1)>=outs)h=h.replace('value="s0"','value="s0" selected');
  return h;}
const vOff=(s,t)=>t.vid&&s.video?(s.video.off||0)/1000:0;
function stripMsg(s,t){const o=outVal(t.out);return {g:effGain(s,t),pan:t.pan||0,mute:false,out:o.out,om:o.om,off:vOff(s,t)};}
function sendStrips(){const s=songs[cur];if(!s)return;
  if(NATIVE)s.tracks.forEach((t,i)=>eng(Object.assign({op:'strip',i},stripMsg(s,t))));else waMix();}
function defaultOut(name){return isClick(name)&&outs>2?'m2':'s0';}

let mixKeys=[];
const isClk=t=>t.click!=null?t.click:isClick(t.name);
const clickIdx=s=>s?s.tracks.findIndex(isClk):-1;

  const s=songs[cur],m=$('mix');
  if(!s){m.innerHTML='<div class="empty">Importa un progetto ARNOCLICK (File › Importa) o dei file audio.</div>';return;}
  const B={},K=[];const add=(k,x)=>{B[k]=x;K.push(k);};

  const dbs=v=>v<=-60?'-∞':(v>0?'+':'')+(+v).toFixed(1);
  const fad=(a,min,max,v)=>`<div class="fad"><input type="range" data-a="${a}" min="${min}" max="${max}" step="0.5" value="${v}"></div>`;
  const ci=clickIdx(s);
  s.tracks.forEach((t,i)=>{const lk=L(t);add('t:'+t.fid,`<div class="strip${i===ci?' isclk':''}" data-k="t:${t.fid}" data-i="${i}" style="${stripBg(lk.col,lk.int)}">
    ${t.click||t.vid?'<button class="x" data-a="del" title="Togli la traccia dal brano">✕</button>':''}
    <div class="hd" data-a="look" title="Colore e icona"><span class="ico">${lk.ico}</span><b>${esc(t.name)}</b><span class="lbl">${t.dur?fmtL(t.dur):''}</span></div>
    ${i===ci?'<div class="clkl"><i class="led" id="ledS"></i>CLICK</div>':''}
    <div class="tg"><button class="m${t.mute?' on':''}" data-a="mute">M</button><button class="s${t.solo?' on':''}" data-a="solo">S</button></div>
    <select data-a="out">${outOptions(t.out)}</select>
    <div class="pn"><input type="range" class="pan" data-a="pan" min="-1" max="1" step="0.05" value="${t.pan||0}" title="Panorama"><span class="panc${Math.abs(t.pan||0)>0.001?' off':''}" title="Rosso = panorama non al centro (doppio tocco sul cursore per centrarlo)">C</span></div>
    <div class="body">${fad('db',-60,6,t.db)}<div class="vm"><i></i></div></div>
    <div class="db">${dbs(t.db)} dB</div>${ord('t:'+t.fid)}</div>`);});
  if(cfg.inOn)cfg.inputs.forEach((x,k)=>add('in'+k,`<div class="strip" data-k="in${k}" data-i="in${k}" style="${stripBg(x.col,x.int)}">
    <button class="x" data-a="idel" title="Togli l'ingresso">✕</button>
    <div class="hd" data-a="look" title="Colore e icona"><span class="ico">${x.ico||'🎤'}</span><b>${esc(x.name||((LANG==='en'?'Input ':'Ingresso ')+(k+1)))}</b><span class="lbl">In ${x.a+1}${x.b>=0&&x.b!==x.a?'-'+(x.b+1):''}</span></div>
    <div class="tg"><button class="m${x.mute?' on':''}" data-a="imute">M</button><button data-a="icfg">⚙</button></div>
    <select data-a="iout">${outOptions(x.out)}</select><div class="pn"></div>
    <div class="body">${fad('idb',-60,12,x.db)}<div class="vm"><i></i></div></div>
    <div class="db">${dbs(x.db)} dB</div>${ord('in'+k)}</div>`));
  add('master',`<div class="strip mstr" data-k="master" data-i="master" style="${stripBg(cfg.mCol,cfg.mInt)}">
    <div class="hd" data-a="look" title="Colore e icona"><span class="ico">${cfg.mIco||'🔊'}</span><b>Master</b><span class="lbl">${NATIVE?esc(cardName)+' · '+outs+' out':'browser'}</span></div>
    <div class="tg"><button class="mono${cfg.mono?' on':''}" data-a="mono" title="Ascolto in mono">MONO</button></div>
    <div class="body">${fad('mdb',-60,6,cfg.master)}<div class="vm st"><i></i></div><div class="vm st"><i></i></div></div>
    <div class="db">${dbs(cfg.master)} dB</div>${ord('master')}</div>`);
  if(s.video)add('video',`<div class="strip vstrip" data-k="video">
    <button class="x" data-a="vdel" title="Togli il video">✕</button>
    <div class="hd"><span class="ico">🎬</span><b>${esc(s.video.name)}</b><span class="lbl">Video</span></div>
    <span class="lbl">Sync (ms)</span><input type="number" step="10" data-a="voffn" value="${s.video.off||0}">
    <div class="tg"><button data-a="voff" data-d="-40">−</button><button data-a="voff" data-d="40">＋</button></div>
    ${s.tracks.some(t=>t.vid||t.fid===s.video.fid)?'':'<button class="btn" data-a="vaud" style="font-size:11px">＋ Audio</button>'}
    <div class="body"><div class="fad"><input type="range" data-a="voffr" min="-2000" max="2000" step="10" value="${s.video.off||0}" title="Sync del video (doppio tocco: 0)"></div></div>
    <div class="db">${s.video.off>0?'+':''}${s.video.off||0} ms</div>${ord('video')}</div>`);
  const O=(s.order||[]).filter(k=>B[k]);K.forEach(k=>{if(!O.includes(k)){const f=O.findIndex(x=>!x.startsWith('t:'));O.splice(k.startsWith('t:')&&f>=0?f:O.length,0,k);}});
  mixKeys=O;document.body.classList.toggle('hasclk',ci>=0);
  $('addClk').classList.toggle('hide',ci>=0);$('addIn').classList.toggle('hide',!(NATIVE&&cfg.inOn&&cfg.inputs.length<Math.max(1,ins)));
  m.innerHTML=O.map(k=>B[k]).join('');fitFaders();
}
// tutto il mixer si ridimensiona in proporzione all'altezza disponibile
const MIXH=430;
function fitFaders(){const m=$('mix'),H=m.clientHeight;if(!H)return;const k=Math.max(0.5,Math.min(1.3,H/MIXH));m.style.setProperty('--mz',k.toFixed(3));
  requestAnimationFrame(()=>document.querySelectorAll('#mix .fad').forEach(f=>f.style.setProperty('--fh',Math.max(40,f.clientHeight-6)+'px')));}
if(window.ResizeObserver)new ResizeObserver(()=>fitFaders()).observe($('mix'));
$('mix').addEventListener('input',e=>{const el=e.target,a=el.dataset.a,s=songs[cur];if(!s)return;
  const row=el.closest('.strip'),i=row&&+row.dataset.i;
  if(a==='db'||a==='pan'){const t=s.tracks[i];if(a==='pan'&&Math.abs(+el.value)<0.08)el.value=0;t[a]=+el.value;if(a==='pan'){const c=row.querySelector('.panc');if(c)c.classList.toggle('off',Math.abs(t.pan)>0.001);}if(a==='db')row.querySelector('.db').textContent=(t.db<=-60?'-∞':(t.db>0?'+':'')+t.db.toFixed(1))+' dB';sendStrips();saveSongs();}
  else if(a==='mdb'){cfg.master=+el.value;row.querySelector('.db').textContent=(cfg.master<=-60?'-∞':(cfg.master>0?'+':'')+cfg.master.toFixed(1))+' dB';if(NATIVE)eng({op:'master',g:dbg(cfg.master)});else waMix();saveCfg();}
  else if(a==='idb'){const x=cfg.inputs[+row.dataset.i.slice(2)];x.db=+el.value;row.querySelector('.db').textContent=(x.db<=-60?'-∞':(x.db>0?'+':'')+x.db.toFixed(1))+' dB';sendInput();saveCfg();}
  else if(a==='voffr'){s.video.off=+el.value;const st=el.closest('.strip');st.querySelector('input[type=number]').value=s.video.off;st.querySelector('.db').textContent=(s.video.off>0?'+':'')+s.video.off+' ms';saveSongs();sendStrips();if(!NATIVE&&playing)waPlay(waPos());syncVideo(true);}
  else if(a==='voffn'){s.video.off=+el.value||0;saveSongs();sendStrips();if(!NATIVE&&playing)waPlay(waPos());syncVideo(true);}
});
$('mix').addEventListener('change',e=>{const el=e.target,a=el.dataset.a,s=songs[cur];if(!s)return;const row=el.closest('.strip');
  if(a==='out'){s.tracks[+row.dataset.i].out=el.value;sendStrips();saveSongs();}
  else if(a==='iout'){cfg.inputs[+row.dataset.i.slice(2)].out=el.value;sendInput();saveCfg();}});
(()=>{let lt={el:null,t:0};const DEF={db:0,pan:0,idb:0,mdb:0,voffr:0};
  const reset=el=>{const v=DEF[el.dataset.a];if(v==null)return;const go=()=>{el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));};go();setTimeout(go,60);setTimeout(go,250);};
  $('mix').addEventListener('pointerdown',e=>{const el=e.target;if(el.type!=='range')return;const now=Date.now();
    if(lt.el===el&&now-lt.t<380){e.preventDefault();reset(el);lt={el:null,t:0};}else lt={el,t:now};},true);})();
$('mix').addEventListener('dblclick',e=>{if(e.target.dataset.a==='voffr'){songs[cur].video.off=0;saveSongs();renderMix();sendStrips();syncVideo(true);return;}if(e.target.dataset.a==='pan'){const s=songs[cur],t=s.tracks[+e.target.closest('.strip').dataset.i];t.pan=0;e.target.value=0;sendStrips();saveSongs();}});
(()=>{const mx=$('mix');let drag=null,tm=0,p0=null;
  const stop=()=>{clearTimeout(tm);p0=null;};
  mx.addEventListener('pointerdown',e=>{const st=e.target.closest('.strip[data-k]');if(!st||e.target.closest('input,select,button'))return;
    p0={x:e.clientX,y:e.clientY};tm=setTimeout(()=>{drag={st,k:st.dataset.k,x0:p0.x,sl:mx.scrollLeft};st.classList.add('dragging');mx.classList.add('dragmode');if(navigator.vibrate)navigator.vibrate(15);},420);});
  window.addEventListener('pointermove',e=>{if(p0&&!drag&&Math.hypot(e.clientX-p0.x,e.clientY-p0.y)>9)stop();
    if(!drag)return;const r=mx.getBoundingClientRect();if(e.clientX<r.left+30)mx.scrollLeft-=10;else if(e.clientX>r.right-30)mx.scrollLeft+=10;
    drag.st.style.transform=`translateX(${(e.clientX-drag.x0)+(mx.scrollLeft-drag.sl)}px)`;drag.x=e.clientX;});
  mx.addEventListener('touchmove',e=>{if(drag)e.preventDefault();},{passive:false});
  const end=()=>{stop();if(!drag)return;const d=drag;drag=null;mx._nd=Date.now();mx.classList.remove('dragmode');d.st.classList.remove('dragging');d.st.style.transform='';
    if(d.x==null)return;const O=mixKeys.filter(k=>k!==d.k);let at=O.length;
    for(let j=0;j<O.length;j++){const el=mx.querySelector(`.strip[data-k="${O[j]}"]`);if(!el)continue;const b=el.getBoundingClientRect();if(d.x<b.left+b.width/2){at=j;break;}}
    O.splice(at,0,d.k);const s=songs[cur];if(s){s.order=O;saveSongs();renderMix();}};
  window.addEventListener('pointerup',end);mx.addEventListener('pointercancel',()=>{if(!drag)stop();});
  mx.addEventListener('contextmenu',e=>e.preventDefault());})();
$('mix').addEventListener('click',async e=>{if(Date.now()-($('mix')._nd||0)<500)return;const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;
  const a=el.dataset.a,s=songs[cur];if(!s)return;const row=el.closest('.strip'),i=row?+row.dataset.i:-1;
  if(a==='mute'||a==='solo'){s.tracks[i][a]=!s.tracks[i][a];renderMix();sendStrips();saveSongs();}
  else if(a==='del'){const t=s.tracks[i];if(!t.click&&!t.vid)return;if(!confirm('Togliere «'+t.name+'» dal brano?'))return;s.tracks.splice(i,1);saveSongs();await stop();await loadSong(cur,false);}
  else if(a==='up'||a==='dn'){const k=el.dataset.k,O=mixKeys.slice(),j=O.indexOf(k),n=a==='up'?j-1:j+1;if(j<0||n<0||n>=O.length)return;[O[j],O[n]]=[O[n],O[j]];s.order=O;saveSongs();renderMix();}
  else if(a==='look')lookSheet(row.dataset.i);
  else if(a==='mono'){cfg.mono=!cfg.mono;saveCfg();sendMono();renderMix();status(cfg.mono?'Master in MONO.':'Master in stereo.');}
  else if(a==='imute'){const x=cfg.inputs[+row.dataset.i.slice(2)];x.mute=!x.mute;saveCfg();sendInput();renderMix();}
  else if(a==='icfg')inputSheet(+row.dataset.i.slice(2));
  else if(a==='idel'){const k=+row.dataset.i.slice(2);if(!confirm('Togliere «'+(cfg.inputs[k].name||(LANG==='en'?'Input ':'Ingresso ')+(k+1))+'»?'))return;cfg.inputs.splice(k,1);saveCfg();sendInput();renderMix();}
  else if(a==='voff'){s.video.off=(s.video.off||0)+(+el.dataset.d);saveSongs();renderMix();sendStrips();if(!NATIVE&&playing)waPlay(waPos());syncVideo(true);}
  else if(a==='vaud'){s.tracks.push({fid:s.video.fid,name:'Audio del video',vid:true,ico:'🎬',db:0,pan:0,mute:false,solo:false,out:'s0'});saveSongs();await stop();await loadSong(cur,false);}
  else if(a==='vdel'){if(!confirm('Togliere il video (e il suo audio) dal brano?'))return;s.tracks=s.tracks.filter(t=>!t.vid&&t.fid!==s.video.fid);s.video=null;saveSongs();await loadSong(cur,false);}
});

const blobBuf=b=>b.arrayBuffer?b.arrayBuffer():new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(b);});
async function readZip(file,cb){
  const tail=new DataView(await blobBuf(file.slice(Math.max(0,file.size-65558))));let p=-1;
  for(let i=tail.byteLength-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){p=i;break;}
  if(p<0)throw new Error('zip');
  const n=tail.getUint16(p+10,true),cdSize=tail.getUint32(p+12,true),cdOff=tail.getUint32(p+16,true);
  const cd=new DataView(await blobBuf(file.slice(cdOff,cdOff+cdSize))),dec=new TextDecoder(),out={};let q=0;
  for(let k=0;k<n;k++){if(cd.getUint32(q,true)!==0x02014b50)throw new Error('zip');
    const meth=cd.getUint16(q+10,true),csz=cd.getUint32(q+20,true),nl=cd.getUint16(q+28,true),xl=cd.getUint16(q+30,true),cl=cd.getUint16(q+32,true),lo=cd.getUint32(q+42,true);
    const name=dec.decode(new Uint8Array(cd.buffer,cd.byteOffset+q+46,nl));q+=46+nl+xl+cl;
    if(name.endsWith('/')||/(^|\/)(__MACOSX|\._)/.test(name))continue;
    const lh=new DataView(await blobBuf(file.slice(lo,lo+30))),start=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    let b=file.slice(start,start+csz);
    if(meth===8){if(!window.DecompressionStream)throw new Error('deflate');b=await new Response(b.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();}
    else if(meth!==0)continue;
    out[name]=b;if(cb)cb(k+1,n,name);}
  return out;
}

const songKey=p=>{const parts=p.split('/').filter(x=>x&&!/^(__MACOSX)$/.test(x));

async function importBatch(ent,label){
  if(!JOB.on)jobStart('Importo «'+label+'»');

  const zips=ent.filter(e=>/\.zip$/i.test(e.n)),rest=ent.filter(e=>AUD.test(e.n)||VID.test(e.n));
  // se tutti i file stanno in un'unica cartella principale, quella non conta come brano

    const nm=g[0].n.includes('/')?g[0].n.split('/').slice(-2,-1)[0]:strip(base(first.n));

  for(const z of zips){jobSet(0.1+0.85*k/tot,'Brano '+(k+1)+' di '+tot,base(z.n));k++;
    try{const F=await readZip(z.blob);let meta=null;if(F['arnoclick.json'])try{meta=JSON.parse(new TextDecoder().decode(await blobBuf(F['arnoclick.json'])));}catch(e){}

async function exportSheet(name,PJ){const SG=PJ.lib;
  if(!SG.length){status('La raccolta è vuota.',true);return;}
  if(!NATIVE){status('La condivisione del progetto .zip funziona nell\'app per iPhone/iPad.',true);return;}
  const vidIds=new Set(SG.filter(x=>x.video).map(x=>x.video.fid)),audIds=new Set(SG.flatMap(x=>x.tracks.map(t=>t.fid)));
  const isVidFile=id=>vidIds.has(id)||SG.some(x=>x.tracks.some(t=>t.fid===id&&t.vid));
  let aB=0,vB=0,eB=0;for(const id of new Set([...vidIds,...audIds])){const f=await fGet(id);const z=f?f.blob.size:0;if(isVidFile(id)||(f&&VID.test(f.name)))vB+=z;else aB+=z;}
  for(const x of SG)for(const t of x.tracks){const f=await fGet(t.fid);if(f&&(isVidFile(t.fid)||VID.test(f.name)))eB+=(t.dur||x.dur||240)*32000;}
  const LIM=4*1073741824,WARN=1.5*1073741824;
  const msg=t=>t>LIM?`<div class="warnx bad">⛔ Troppo pesante (${mb(t)}): il file .zip non può superare 4 GB. Riduci il carico: esporta solo l'audio o salva meno brani nel progetto.</div>`:t>WARN?`<div class="warnx">⚠️ Pacchetto pesante (${mb(t)}): AirDrop funziona, ma Messaggi e WhatsApp lo rifiuteranno e ci vorrà tempo. Per ridurre il carico esporta solo l'audio.</div>`:'';
  sheet(`<h3>📤 Condividi progetto</h3><div class="frm"><span>Nome</span><input id="exN" value="${esc(name||'Concerto')}"></div>
   <div class="expo"><label><input type="radio" name="exK" value="a"> <span><b>Solo audio</b> — ${mb(aB+eB)}${eB?' circa':''}<br><small>Tracce, click, mixer e colori, senza video.${eB?' L\'audio dei video viene estratto in file audio leggeri (.m4a).':''}</small></span></label>
   <label><input type="radio" name="exK" value="v" checked> <span><b>Audio e video</b> — ${mb(aB+vB)}<br><small>Tutto il progetto, video compresi.</small></span></label></div>
   <div id="exW">${msg(aB+vB)}</div>
   <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button class="btn" onclick="closeSheet()">Annulla</button><button class="btn acc" id="exGo">Crea e condividi</button></div>`);
  const kind=()=>document.querySelector('input[name=exK]:checked').value,tot=()=>kind()==='a'?aB+eB:aB+vB;
  document.querySelectorAll('input[name=exK]').forEach(r=>r.onchange=()=>{$('exW').innerHTML=msg(tot());$('exGo').disabled=tot()>LIM;});
  $('exGo').disabled=tot()>LIM;
  $('exGo').onclick=()=>{const n=$('exN').value.trim()||'Progetto',k=kind();closeSheet();doExport(n,PJ,k==='v');};
}
async function doExport(name,PJ,withVideo){const SG=PJ.lib,LK=PJ.looks;
  if(busy)return;busy=true;jobStart('Esporto «'+name+'» ('+(withVideo?'audio e video':'solo audio')+')');
  try{const S=JSON.parse(JSON.stringify(SG));
    const vset=new Set(S.filter(x=>x.video).map(x=>x.video.fid));
    if(!withVideo)S.forEach(x=>{x.video=null;});
    let ids=[...new Set(S.flatMap(x=>x.tracks.map(t=>t.fid).concat(x.video?[x.video.fid]:[])))];
    jobSet(0,'Preparo i file','');
    await ensureNative(ids,null,(f,n,d,t)=>jobSet(f*(withVideo?0.35:0.2),'Copio i file nell\'app',n+' · '+mb(d)+(LANG==='en'?' of ':' di ')+mb(t)));
    const names={};for(const id of ids){const f=await fGet(id);names[id]=f?f.name:id;}
    if(!withVideo){ // tracce che leggono l'audio da un file video: estraggo solo l'audio
      const vids=ids.filter(id=>vset.has(id)||VID.test(names[id]||'')||S.some(x=>x.tracks.some(t=>t.fid===id&&t.vid)));const map={};
      for(let k=0;k<vids.length;k++){const id=vids[k],nid=id+'a';jobSet(0.2+0.15*k/vids.length,'Estraggo l\'audio dai video',(names[id]||id)+' ('+(k+1)+'/'+vids.length+')');
        const r=await NS.postMessage({op:'extract',id,nid});if(r&&r.ok){map[id]=nid;names[nid]=strip(names[id]||id)+'.m4a';}}
      S.forEach(x=>x.tracks.forEach(t=>{if(map[t.fid]){t.fid=map[t.fid];t.vid=false;}}));
      ids=[...new Set(S.flatMap(x=>x.tracks.map(t=>t.fid)))];}
    const files=ids.map(id=>({id,path:'media/'+id+'.'+extOf(names[id])}));
    const json=JSON.stringify({format:'arnostage',v:2,version:VERSION,name,video:withVideo,lib:S,sets:PJ.sets,curSet:PJ.curSet,looks:LK,names,files:Object.fromEntries(files.map(f=>[f.id,f.path]))});
    jobSet(0.35,'Creo lo .zip','');
    await NS.postMessage({op:'export',name,json,files});
    jobEnd('«'+name+'.arnostage.zip» pronto: scegli AirDrop, Messaggi o Salva in File.');
  }catch(e){jobEnd('Esportazione non riuscita: '+e,true);}finally{busy=false;}
}

const EN_R=[[/(\d+) brani\b/g,'$1 songs'],[/(\d+) tracce\b/g,'$1 tracks'],[/(\d+) scalette\b/g,'$1 setlists'],[/(\d+) scaletta\b/g,'$1 setlist'],[/^Brano (\d+) di (\d+)$/,'Song $1 of $2'],[/ · (\d+) di ([\d.]+ [MG]B)$/,' · $1 of $2']];
function tr(x){if(LANG!=='en'||x==null)return x;x=String(x);if(!/[A-Za-zÀ-ú]/.test(x))return x;const t=x.trim();
  if(EN_X[t]!=null)return x.replace(t,EN_X[t]);let y=x;for(const [a,b] of EN_P)if(y.includes(a))y=y.split(a).join(b);for(const [r,b] of EN_R)y=y.replace(r,b);return y;}
function trNode(n){if(n.nodeType===3){if(n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))return;const v=tr(n.data);if(v!==n.data)n.data=v;}
  else if(n.nodeType===1){for(const a of ['title','placeholder'])if(n.hasAttribute&&n.hasAttribute(a)){const v=tr(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v);}
    for(const c of n.childNodes)trNode(c);}}
if(LANG==='en'){document.documentElement.lang='en';
  const _c=window.confirm.bind(window),_p=window.prompt.bind(window),_a=window.alert.bind(window);
  window.confirm=m=>_c(tr(m));window.prompt=(m,d)=>_p(tr(m),d);window.alert=m=>_a(tr(m));
  trNode(document.body);
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')trNode(m.target);else if(m.type==='attributes')trNode(m.target);else m.addedNodes.forEach(trNode);}})
    .observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['title','placeholder']});}
